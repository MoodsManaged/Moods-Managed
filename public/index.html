<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      background: radial-gradient(circle, #2c2f6b, #0d0f2e);
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h1 {
      margin-top: 40px;
      font-size: 60px;
      color: gold;
      text-shadow: 0 0 25px gold;
    }

    #scenario {
      margin: 30px;
    }

    h2 {
      font-size: 30px;
      margin-bottom: 15px;
    }

    p {
      font-size: 20px;
    }

    #cards {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 50px;
      flex-wrap: wrap;
    }

    /* ✅ BIG GAME CARDS */
    .card {
      background: linear-gradient(145deg, #1b1d47, #2a2f85);
      width: 320px;
      padding: 35px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 20px;
      transition: 0.25s;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .card:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px rgba(255,255,255,0.4);
    }

    .card:active {
      transform: scale(0.97);
    }

  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="game">
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>

// ===== BASIC =====
let level = 1;
let unrest = 0;
let usedScenarios = [];

// ===== EMOTIONS =====
const emotionGroups = {
  angry: ["angry","frustrated","annoyed","furious","jealous"],
  scared: ["anxious","nervous","worried","panicked","overwhelmed"],
  sad: ["sad","lonely","disappointed","hopeless","tired"],
  happy: ["happy","excited","joyful","cheerful"],
  calm: ["calm","peaceful","relaxed","safe"],
  strong: ["confident","brave","proud"]
};

// ===== SMART COPING =====
const copingByEmotion = {

  scared: {
    best: [
      "Take slow deep breaths",
      "Notice 5 things around you",
      "Sit somewhere safe",
      "Wrap in a blanket"
    ],
    good: [
      "Talk to someone",
      "Drink water",
      "Look around",
      "Remind yourself you’re safe"
    ]
  },

  angry: {
    best: [
      "Take deep breaths",
      "Go for a walk",
      "Stretch",
      "Step away"
    ],
    good: [
      "Kick a ball",
      "Rip paper",
      "Listen to music",
      "Write feelings"
    ]
  },

  sad: {
    best: [
      "Talk to a friend",
      "Let yourself cry",
      "Hug something",
      "Write in a diary"
    ],
    good: [
      "Draw",
      "Listen to calm music",
      "Think of someone you love",
      "Rest"
    ]
  },

  happy: {
    best: [
      "Share your happiness",
      "Play a game",
      "Smile",
      "Enjoy the moment"
    ],
    good: [
      "Dance",
      "Create something",
      "Celebrate",
      "Help someone"
    ]
  },

  calm: {
    best: [
      "Stay present",
      "Relax",
      "Enjoy quiet",
      "Read a book"
    ],
    good: [
      "Listen to music",
      "Take a walk",
      "Sit peacefully",
      "Breathe slowly"
    ]
  },

  strong: {
    best: [
      "Set a goal",
      "Try something new",
      "Keep going",
      "Encourage others"
    ],
    good: [
      "Practice a skill",
      "Help someone",
      "Plan something",
      "Take initiative"
    ]
  }
};

function getCopingOptions(type) {
  const group = copingByEmotion[type];

  const combined = [
    ...group.best,
    ...group.best,
    ...group.good
  ];

  return combined
    .sort(() => Math.random() - 0.5)
    .slice(0, 4);
}

// ===== START AUTO =====
window.onload = () => nextScenario();

// ===== MAIN LOOP =====
function nextScenario() {

  if (unrest >= 5) {
    document.getElementById("game").innerHTML =
      "<h2>💥 Too much unrest...</h2>";
    return;
  }

  const s = generateScenario();

  window.currentEmotion = s.emotion.type;

  document.getElementById("scenario").innerHTML = `
    <h2>${s.text}</h2>
    <p>💭 I feel <b>${s.emotion.word}</b></p>
    <p>What should I do FIRST?</p>
  `;

  const container = document.getElementById("cards");
  container.innerHTML = "";

  ["Pause","Notice feeling","Think"]
    .forEach(c => {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = c;
      el.onclick = showDecision;
      container.appendChild(el);
    });
}

// ===== DECISION =====
function showDecision() {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  const options = [
    {text:"Pause and think", v:1},
    {text:"Ask for help", v:1},
    {text:"Ignore it", v:0},
    {text:"React instantly", v:-1}
  ].sort(() => Math.random() - 0.5);

  options.forEach(o => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = o.text;

    el.onclick = () => {
      if (o.v === 1) level++;
      if (o.v === -1) unrest++;
      showCoping();
    };

    container.appendChild(el);
  });
}

// ===== COPING =====
function showCoping() {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  const options = getCopingOptions(window.currentEmotion);

  options.forEach(c => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = c;
    el.onclick = () => showFeedback();
    container.appendChild(el);
  });
}

// ===== FEEDBACK =====
function showFeedback() {
  document.getElementById("cards").innerHTML = "<p>💚 Good choice</p>";
  setTimeout(nextScenario, 1500);
}

// ===== SCENARIOS MATCHED =====
function generateScenario() {

const scenarios = [

{text:"The dragon broke a wing and cannot fly", type:"sad"},
{text:"A villager is going to a new school", type:"scared"},
{text:"The prince hears parents arguing", type:"scared"},
{text:"A child wakes up in the dark", type:"scared"},
{text:"A friend is not speaking", type:"sad"},
{text:"A scary shadow appears at night", type:"scared"},
{text:"Plans suddenly change", type:"sad"},
{text:"A child feels overwhelmed", type:"scared"},
{text:"Someone is not invited", type:"sad"},

{text:"The dragon is teased in front of others", type:"angry"},
{text:"Someone says something mean", type:"angry"},
{text:"A game feels unfair", type:"angry"},

{text:"A child succeeds at something", type:"strong"},
{text:"Helping someone else", type:"strong"},

{text:"A quiet peaceful moment", type:"calm"},
{text:"Reading quietly", type:"calm"},

{text:"Playing a fun game", type:"happy"},
{text:"A celebration is happening", type:"happy"}

];

let available = scenarios.filter(s => !usedScenarios.includes(s.text));

if (available.length === 0) {
  usedScenarios = [];
  available = scenarios;
}

const chosen = available[Math.floor(Math.random() * available.length)];
usedScenarios.push(chosen.text);

const emoList = emotionGroups[chosen.type];

return {
  text: chosen.text,
  emotion: {
    type: chosen.type,
    word: emoList[Math.floor(Math.random() * emoList.length)]
  }
};

}

</script>

</body>
</html>
