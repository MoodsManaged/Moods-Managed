<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:#1a1c4b;
}

h1{font-size:50px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:30px;}
#scenario p{font-size:24px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:30px;
margin:50px;
}

/* ✅ REAL CARD LOOK */
.card{
width:220px;
height:320px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
transition:0.6s;
transform-style:preserve-3d;
}

.card.flip .inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
padding:20px;
border-radius:18px;

display:flex;
align-items:center;
justify-content:center;
text-align:center;

backface-visibility:hidden;
}

/* ✅ BEAUTIFUL CARD */
.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

/* ✅ HOVER EFFECT */
.card:hover{
transform:translateY(-10px) scale(1.04);
}

button{
padding:12px 24px;
font-size:18px;
border-radius:10px;
border:none;
cursor:pointer;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

// ===== STATE =====
let step = 0;
let score = 0;
let streak = 0;

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ===== EMOTIONS
const emotions={
scared:["anxious","nervous","on edge","panicked"],
angry:["frustrated","angry","furious"],
sad:["down","lonely","hurt"],
happy:["happy","excited","joyful"],
calm:["calm","peaceful","relaxed"],
strong:["confident","brave","capable"]
};

// ===== 50 STRONG SCENARIOS (MATCHED)
const scenarios = [];

// build 50 scenarios cleanly
const baseScenarios = [
{t:"I hear something moving in the dark",e:"scared"},
{t:"The lights suddenly go out",e:"scared"},
{t:"A loud noise makes me jump",e:"scared"},
{t:"I feel unsafe somewhere unfamiliar",e:"scared"},
{t:"Something startles me unexpectedly",e:"scared"},

{t:"Someone treats me unfairly",e:"angry"},
{t:"Someone says something rude",e:"angry"},
{t:"I get blamed for something I didn't do",e:"angry"},
{t:"Someone interrupts me",e:"angry"},
{t:"My effort is ignored",e:"angry"},

{t:"A friend ignores me",e:"sad"},
{t:"I feel left out",e:"sad"},
{t:"Something important didn’t work out",e:"sad"},
{t:"I feel alone",e:"sad"},
{t:"I miss someone",e:"sad"},

{t:"I finish something difficult",e:"strong"},
{t:"I help someone succeed",e:"strong"},
{t:"I try something new",e:"strong"},
{t:"I solve a hard problem",e:"strong"},
{t:"I keep going even when it’s hard",e:"strong"},

{t:"Everything feels calm and quiet",e:"calm"},
{t:"I am resting peacefully",e:"calm"},
{t:"Nothing is rushing me",e:"calm"},
{t:"I feel steady and relaxed",e:"calm"},
{t:"I enjoy a quiet moment",e:"calm"},

{t:"I am having fun with others",e:"happy"},
{t:"Something exciting happens",e:"happy"},
{t:"I feel proud of myself",e:"happy"},
{t:"I laugh a lot",e:"happy"},
{t:"I enjoy a great moment",e:"happy"}
];

// make it 50
while(scenarios.length < 50){
scenarios.push({
text: baseScenarios[scenarios.length % baseScenarios.length].t,
type: baseScenarios[scenarios.length % baseScenarios.length].e
});
}

// shuffle
scenarios.sort(()=>Math.random()-0.5);

// ===== PROCESSING PER EMOTION
const processing = {
scared:[
"Wait… am I safe?",
"I need to slow my breathing.",
"Look around carefully.",
"Don’t panic.",
"I can handle this."
],
angry:[
"Pause… don’t react yet.",
"Why is this bothering me?",
"Take a breath.",
"Don’t snap.",
"Step back."
],
sad:[
"This feels really heavy.",
"Maybe I should talk to someone.",
"It’s okay to feel this.",
"I need a moment.",
"I shouldn’t go through this alone."
],
happy:[
"This feels good.",
"I want to enjoy this.",
"Stay in this moment.",
"I should appreciate this.",
"This is a nice moment."
],
calm:[
"Just stay here.",
"This feels steady.",
"Nothing needs rushing.",
"I can enjoy this.",
"Stay present."
],
strong:[
"I’ve got this.",
"I feel capable.",
"Keep going.",
"I can do more.",
"Let’s build on this."
]
};

// ===== COPING
const coping={
scared:["Breathe slowly","Look around","Find safety","Talk to someone","Stay grounded"],
angry:["Move your body","Take space","Breathe deeply","Reset","Release tension"],
sad:["Talk to someone","Rest","Comfort yourself","Cry","Take care of yourself"],
happy:["Share it","Celebrate","Enjoy it","Smile","Stay present"],
calm:["Relax","Stay present","Breathe","Enjoy quiet","Rest"],
strong:["Keep going","Try more","Help someone","Lead","Build on it"]
};

// ===== CARD
function card(text,next){
let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ===== MAIN LOOP
function next(){

if(step>=50) return endGame();

let s = scenarios[step];
let emoWord = emotions[s.type][Math.random()*emotions[s.type].length|0];

let round = Math.floor(step/5)+1;
let scenarioNum = (step%5)+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5 — Score: ${score}`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>I feel <b>${emoWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

// ✅ processing only (NO decisions)
processing[s.type].forEach(t=>{
c.appendChild(card(t,()=>showCoping(s)));
});

}

// ===== COPING
function showCoping(s){

let c=document.getElementById("cards");
c.innerHTML="";

coping[s.type].forEach(x=>{
c.appendChild(card(x,()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ GO TO NEXT SCENARIO</button>`;
}));
});
}

// ===== START
function startGame(){
step=0;
score=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 You completed all 10 rounds!</h2>
<p>Score: ${score}</p>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
