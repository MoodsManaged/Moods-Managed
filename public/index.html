<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background: radial-gradient(circle,#2c2f6b,#0d0f2e);
}

h1{font-size:55px;color:gold;}

#avatar{font-size:90px;margin:20px;}

#scenario h2{font-size:32px;}
#scenario p{font-size:28px;}

#cards{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:40px;
}

.card{
width:240px;
height:360px;
perspective:1000px;
cursor:pointer;
}

.card-inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flipped .card-inner{transform:rotateY(180deg);}

.card-front,.card-back{
position:absolute;
width:100%;
height:100%;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.card-front{background:#2a2f85;}
.card-back{background:#111;transform:rotateY(180deg);}

.processing .card-front{border:3px solid #3a86ff;}
.decision .card-front{border:3px solid gold;}
.coping .card-front{border:3px solid #06d6a0;}

button{
padding:15px 30px;
font-size:20px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="roundInfo"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let usedScenarios=[];
let score=0;

const chars=["⚔️","🧙","🐉","👑","🧝","🦄","🐺","🧑"];

const emotionWords={
angry:["angry","frustrated","annoyed","furious"],
scared:["anxious","nervous","on edge","panicked"],
sad:["sad","down","lonely","disappointed"],
happy:["happy","excited","joyful","playful"],
calm:["calm","peaceful","safe","relaxed"],
strong:["confident","brave","capable","proud"]
};

const clusters={
home:[
{text:"I hear something unusual at night",type:"scared"},
{text:"Something at home feels unfair",type:"angry"},
{text:"I feel left out at home",type:"sad"}
],
school:[
{text:"Someone laughs at me",type:"sad"},
{text:"I have to speak in front of everyone",type:"scared"},
{text:"Something feels really unfair in class",type:"angry"}
],
social:[
{text:"A friend ignores me",type:"sad"},
{text:"Someone says something hurtful",type:"angry"},
{text:"Meeting new people makes me nervous",type:"scared"}
],
fantasy:[
{text:"Something moves in the shadows nearby",type:"scared"},
{text:"A challenge feels unfair",type:"angry"},
{text:"I fail something important",type:"sad"},
{text:"I overcome something difficult",type:"strong"}
]
};

let allScenarios = Object.values(clusters).flat();

// ✅ HUMAN PROCESSING
const processing = [
"Wait… what’s going on right now?",
"Okay… what am I actually feeling?",
"Maybe I should slow this down.",
"Let me pause for a second.",
"What do I really need right now?",
"I should take a breath first.",
"Let’s not rush this.",
"Hold on… think first.",
"Why is this affecting me?",
"I need a moment to think.",
"Let me just breathe for a second.",
"What’s the best way to handle this?",
"Okay… stay calm.",
"Let’s figure this out.",
"Don’t react immediately.",
"Take a step back for a moment.",
"I should check how I’m feeling.",
"What’s really happening here?",
"Wait before doing anything.",
"I don’t have to react right away."
];

// ✅ HUMAN DECISION SYSTEM
function getDecisionSet(emotion){

const map = {
scared:[
{t:"I should take a breath first.",type:"best"},
{t:"Maybe I can find somewhere safe.",type:"best"},
{t:"I could ask someone for help.",type:"best"},
{t:"Let me just stay calm and look around.",type:"best"},

{t:"Maybe I’ll just wait it out.",type:"okay"},
{t:"I’ll ignore this for now.",type:"okay"},

{t:"I should just panic.",type:"worst"},
{t:"Run without thinking.",type:"worst"}
],

angry:[
{t:"I should pause before reacting.",type:"best"},
{t:"Take a breath… don’t snap.",type:"best"},
{t:"Maybe I should step away.",type:"best"},
{t:"Let’s calm down first.",type:"best"},

{t:"Just ignore it.",type:"okay"},
{t:"Walk away quickly.",type:"okay"},

{t:"I’m going to yell.",type:"worst"},
{t:"React immediately.",type:"worst"}
],

sad:[
{t:"Maybe I should talk to someone.",type:"best"},
{t:"It’s okay to feel this…",type:"best"},
{t:"I should be gentle with myself.",type:"best"},
{t:"I could reach out.",type:"best"},

{t:"I’ll stay quiet.",type:"okay"},
{t:"Keep it to myself.",type:"okay"},

{t:"Just shut everything out.",type:"worst"},
{t:"Give up.",type:"worst"}
],

happy:[
{t:"I want to enjoy this moment.",type:"best"},
{t:"Maybe I should share this.",type:"best"},
{t:"This feels really good.",type:"best"},

{t:"Ignore it.",type:"okay"},

{t:"Do something risky.",type:"worst"}
],

calm:[
{t:"Let’s stay in this moment.",type:"best"},
{t:"I feel good right now.",type:"best"},
{t:"Just relax into this.",type:"best"},

{t:"Do nothing.",type:"okay"},

{t:"Rush into something.",type:"worst"}
],

strong:[
{t:"I should take initiative here.",type:"best"},
{t:"I can handle this.",type:"best"},
{t:"Let’s try something bigger.",type:"best"},

{t:"Maybe I’ll ease off.",type:"okay"},

{t:"Push myself too hard.",type:"worst"}
]
};

return map[emotion].sort(()=>Math.random()-0.5).slice(0,4);

}

// ✅ HUMAN COPING
const coping={
scared:[
"Let’s slow my breathing down.",
"I can look around and ground myself.",
"Maybe I should sit somewhere safe.",
"I could talk to someone I trust."
],
angry:[
"I need to move my body a bit.",
"Let me step away before I react.",
"I’m going to take a breath.",
"I can let some of this out safely."
],
sad:[
"Maybe I should talk to someone.",
"It’s okay to cry if I need to.",
"I should give myself some comfort.",
"Rest might actually help."
],
happy:[
"I want to share this with someone.",
"Let me enjoy this fully.",
"I could celebrate this moment.",
"This feels really nice."
],
calm:[
"I’ll stay present in this feeling.",
"Let’s not rush anything.",
"I can just enjoy this calm.",
"Maybe I’ll relax a bit more."
],
strong:[
"I’m going to try something new.",
"I could help someone else now.",
"I feel ready to take this on.",
"Let’s keep building on this."
]
};

// ===== CARD
function card(text,stage,next,meta){
const c=document.createElement("div");
c.className="card "+stage;

const inner=document.createElement("div");
inner.className="card-inner";

const front=document.createElement("div");
front.className="card-front";
front.innerHTML=text;

const back=document.createElement("div");
back.className="card-back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flipped");

if(meta){
if(meta.type==="best")score+=2;
if(meta.type==="okay")score+=1;
}

setTimeout(next,500);
};

return c;
}

// ===== START
function startGame(){
score=0;
usedScenarios=[];
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== MAIN LOOP
function next(){

if(usedScenarios.length===allScenarios.length){
endGame();
return;
}

const clusterKeys = Object.keys(clusters);
const cluster = clusters[clusterKeys[usedScenarios.length % clusterKeys.length]];
const available = cluster.filter(s=>!usedScenarios.includes(s));

let s = available.length>0 
? available[Math.floor(Math.random()*available.length)]
: allScenarios.filter(x=>!usedScenarios.includes(x))[0];

usedScenarios.push(s);

const emo = s.type;
const word = emotionWords[emo][Math.random()*emotionWords[emo].length|0];

document.getElementById("roundInfo").innerHTML=
`Progress: ${usedScenarios.length}/${allScenarios.length} | Score: ${score}`;

document.getElementById("avatar").innerHTML=
chars[Math.random()*chars.length|0];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>💭 I feel <b>${word}</b></p>`;

const cards=document.getElementById("cards");
cards.innerHTML="";

processing.sort(()=>Math.random()-0.5).slice(0,4)
.forEach(t=>cards.appendChild(card(t,"processing",()=>showDecision(emo))));

}

function showDecision(emo){
const cards=document.getElementById("cards");
cards.innerHTML="";

getDecisionSet(emo)
.forEach(d=>cards.appendChild(card(d.t,"decision",()=>showCoping(emo),d)));
}

function showCoping(emo){
const cards=document.getElementById("cards");
cards.innerHTML="";

coping[emo].forEach(c=>{
cards.appendChild(card(c,"coping",()=>{
cards.innerHTML=`
<p>✅ That was a good choice.</p>
<button onclick="next()">➡️ GO TO NEXT ROUND</button>
`;
}));
});
}

function endGame(){
document.getElementById("cards").innerHTML="";
document.getElementById("scenario").innerHTML=
`<h2>🎉 You worked through everything!</h2>
<p>Final Score: ${score}</p>
<button onclick="startGame()">Play Again</button>`;
}

</script>

</body>
</html>
