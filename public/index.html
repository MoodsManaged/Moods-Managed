<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  color: white;
  background: radial-gradient(circle, #2c2f6b, #0d0f2e);
  transition: background 1s ease;
}

h1 { font-size: 55px; color: gold; }

#avatar { font-size: 90px; margin: 20px; }

#scenario h2 { font-size: 32px; }
#scenario p { font-size: 28px; }

#cards {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 40px;
  flex-wrap: wrap;
}

.card {
  width: 240px;
  height: 360px;
  perspective: 1000px;
}

.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 20px;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  text-align: center;
}

.card-front {
  background: linear-gradient(145deg, #1b1d47, #2a2f85);
}

.card-back {
  background: #111;
  transform: rotateY(180deg);
  font-size: 24px;
}

/* STAGE COLORS */
.processing .card-front { border: 3px solid #3a86ff; }
.decision .card-front { border: 3px solid gold; }
.coping .card-front { border: 3px solid #06d6a0; }

.start-button {
  padding: 20px 40px;
  font-size: 24px;
  margin: 20px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
  <p>Welcome to your emotional quest.</p>
  <button class="start-button" onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
  <div id="roundInfo"></div>
  <div id="avatar"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>

// ===== GAME STATE =====
let round = 0;
const maxRounds = 5;
let score = 0;

// ===== DATA =====
const characters=["⚔️","🧙","🐉","👑","🦄"];

const emotionGroups={
  angry:["angry"], scared:["scared"], sad:["sad"],
  happy:["happy"], calm:["calm"], strong:["confident"]
};

const emotionColors={
  angry:"#ff4b5c", scared:"#845ef7", sad:"#6c757d",
  happy:"#ffd166", calm:"#118ab2", strong:"#06d6a0"
};

const processingActions=[
  "Pause and breathe","Notice what I feel","Slow down",
  "Ask what I need","Take a moment","Observe carefully"
];

// ✅ DECISIONS WITH SCORE
const decisions = [
  {text:"Pause and think", type:"best"},
  {text:"Ask for help", type:"best"},
  {text:"Stay calm", type:"best"},
  {text:"Take a breath", type:"best"},

  {text:"Ignore it", type:"okay"},
  {text:"Walk away", type:"okay"},
  {text:"Wait and see", type:"okay"},

  {text:"React instantly", type:"worst"},
  {text:"Yell or lash out", type:"worst"},
  {text:"Give up", type:"worst"}
];

// ===== CARD CREATION =====
function createCard(text, stage, next, meta){

  const card=document.createElement("div");
  card.className="card "+stage;

  const inner=document.createElement("div");
  inner.className="card-inner";

  const front=document.createElement("div");
  front.className="card-front";
  front.innerHTML=text;

  const back=document.createElement("div");
  back.className="card-back";
  back.innerHTML="✓";

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);

  card.onclick=()=>{
    card.classList.add("flipped");

    // ✅ SCORING
    if(meta){
      if(meta.type==="best") score+=2;
      if(meta.type==="okay") score+=1;
    }

    setTimeout(next,500);
  };

  return card;
}

// ===== START =====
function startGame(){
  round = 0;
  score = 0;
  document.getElementById("startScreen").style.display="none";
  document.getElementById("game").style.display="block";
  nextScenario();
}

// ===== MAIN LOOP =====
function nextScenario(){

  round++;

  if(round > maxRounds){
    endGame();
    return;
  }

  document.getElementById("roundInfo").innerHTML =
    `<p>⭐ Round ${round} / ${maxRounds} | Score: ${score}</p>`;

  const avatar=document.getElementById("avatar");
  avatar.innerHTML=characters[Math.random()*characters.length|0];

  const s=generateScenario();

  document.body.style.background =
    `radial-gradient(circle, ${emotionColors[s.emotion.type]}, #111)`;

  window.currentEmotion=s.emotion.type;

  document.getElementById("scenario").innerHTML=`
    <h2>${s.text}</h2>
    <p>💭 I feel <b>${s.emotion.word}</b></p>
  `;

  const cards=document.getElementById("cards");
  cards.innerHTML="";

  processingActions
    .sort(()=>Math.random()-0.5)
    .slice(0,4)
    .forEach(t=>{
      cards.appendChild(createCard(t,"processing",showDecision));
    });
}

// ===== DECISION =====
function showDecision(){

  const cards=document.getElementById("cards");
  cards.innerHTML="";

  const options = decisions
    .sort(()=>Math.random()-0.5)
    .slice(0,4);

  options.forEach(o=>{
    cards.appendChild(createCard(o.text,"decision",showCoping,o));
  });
}

// ===== COPING =====
const copingByEmotion={
  scared:["Breathe slowly","Stay safe"],
  angry:["Walk","Move"],
  sad:["Talk","Cry"],
  happy:["Play","Share"],
  calm:["Relax","Read"],
  strong:["Try","Lead"]
};

function showCoping(){
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  copingByEmotion[window.currentEmotion]
    .forEach(c=>{
      cards.appendChild(createCard(c,"coping",()=>{
        cards.innerHTML="<p>💚 Good choice</p>";
        setTimeout(nextScenario,1000);
      }));
    });
}

// ===== END GAME =====
function endGame(){

  let message = "";

  if(score >= 8) message = "🌟 Amazing emotional awareness!";
  else if(score >= 5) message = "👍 Great job, keep growing!";
  else message = "💡 Good effort — practice makes progress!";

  document.getElementById("cards").innerHTML="";

  document.getElementById("scenario").innerHTML=`
    <h2>🎉 Game Complete!</h2>
    <p>Your Score: <b>${score}</b></p>
    <p>${message}</p>
    <button class="start-button" onclick="startGame()">Play Again</button>
  `;
}

// ===== SCENARIOS =====
function generateScenario(){

const scenarios=[
  {text:"My wing is broken and I cannot fly",type:"sad"},
  {text:"Something feels scary around me",type:"scared"},
  {text:"Something is unfair",type:"angry"},
  {text:"I did something amazing",type:"strong"},
  {text:"Everything feels calm",type:"calm"},
  {text:"I am having fun",type:"happy"}
];

const chosen=scenarios[Math.random()*scenarios.length|0];

return {
  text: chosen.text,
  emotion:{
    type:chosen.type,
    word:emotionGroups[chosen.type][0]
  }
};

}

</script>

</body>
</html>
