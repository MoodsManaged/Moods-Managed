<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
  body {
    background: radial-gradient(circle, #2c2f6b, #0d0f2e);
    color: white;
    text-align: center;
    font-family: Arial;
  }

  h1 {
    margin-top: 50px;
    font-size: 55px;
    color: gold;
    text-shadow: 0 0 25px gold;
  }

  #cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 40px;
    flex-wrap: wrap;
  }

  .card {
    background:#1b1d47;
    width: 230px;
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
  }

  .card:hover {
    transform: scale(1.05);
  }

  .role-button {
    padding: 15px;
    margin: 10px;
    border-radius: 15px;
    cursor: pointer;
  }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Your Role</h2>

<div id="menu">
  <button class="role-button" onclick="startGame('knight')">⚔️ Knight</button>
  <button class="role-button" onclick="startGame('mage')">🧙 Mage</button>
  <button class="role-button" onclick="startGame('dragon')">🐉 Dragon</button>
</div>

<div id="game" style="display:none;">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>
let role = "";
let level = 1;
let unrest = 0;

let usedScenarios = [];

const roles = {
  knight: "⚔️ Knight",
  mage: "🧙 Mage",
  dragon: "🐉 Dragon"
};

const reactions = {
  knight: {
    good: "🛡️ I steady myself and act with control.",
    bad: "⚠️ I rush forward without thinking!"
  },
  mage: {
    good: "🔮 I focus and regain control of my magic.",
    bad: "💥 My magic spins out of control!"
  },
  dragon: {
    good: "🐉 I breathe slowly... my fire calms.",
    bad: "🔥 My anger explodes uncontrollably!"
  }
};

const feedbackGood = [
  "That helps me pause instead of reacting right away.",
  "That gives me time to think about my feeling.",
  "That helps me stay in control of myself.",
  "That’s a strong way to handle what I’m feeling."
];

const feedbackBad = [
  "That might make my feeling stronger.",
  "That could make things harder for me.",
  "That doesn’t give me time to think first.",
  "That might lead me to lose control."
];

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function startGame(r) {
  role = r;
  level = 1;
  unrest = 0;
  usedScenarios = [];

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  nextScenario();
}

function nextScenario() {
  if (unrest >= 5) {
    document.getElementById("game").innerHTML = `
      <h1>💥 I caused too much unrest...</h1>
      <p>I overthrow the kingdom 👑</p>
      <p>But now… I am trapped here forever.</p>
    `;
    return;
  }

  const s = generateScenario();

  document.getElementById("scenario").innerHTML = `
    <h2>${s.text}</h2>
    <p>${s.emoji} I feel <b>${s.feeling}</b></p>
    <p>💭 What should I do FIRST?</p>
  `;

  document.getElementById("stats").innerHTML =
    `${roles[role]} | ⭐ Level ${level} | ⚠️ Unrest ${unrest}`;

  const container = document.getElementById("cards");
  container.innerHTML = "";

  s.process.forEach(c => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = c;
    el.onclick = () => showDecision(s);
    container.appendChild(el);
  });
}

function showDecision(s) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  document.getElementById("scenario").innerHTML +=
    "<p>✅ Now what is the best way for me to handle this?</p>";

  s.choices.forEach(c => createCard(c.text, c.type));
}

function createCard(text, type) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = text;

  el.onclick = () => {
    let msg;

    if (type === "best") {
      level++;
      msg = random(feedbackGood);
    } else if (type === "okay") {
      msg = "That might help a little, but I could choose something stronger.";
    } else {
      unrest++;
      msg = random(feedbackBad);
    }

    showFeedback(msg, reactions[role][type === "worst" ? "bad" : "good"]);
  };

  document.getElementById("cards").appendChild(el);
}

function showFeedback(text, reaction) {
  const msg = document.createElement("div");
  msg.innerHTML = `
    <p>${reaction}</p>
    <p>${text}</p>
  `;
  msg.style.marginTop = "20px";

  document.getElementById("cards").appendChild(msg);

  setTimeout(nextScenario, 2000);
}

function generateScenario() {
  const all = [

    { text: "I dropped everything I was carrying and now I feel overwhelmed.", feeling:"sad", emoji:"😢" },
    { text: "I feel nervous because I have to do something important in front of others.", feeling:"afraid", emoji:"😱" },
    { text: "Someone took something important from me and I feel really angry.", feeling:"angry", emoji:"😡" },
    { text: "I made a mistake and now I feel embarrassed and upset.", feeling:"sad", emoji:"😢" },
    { text: "Something unexpected happened and now I feel scared.", feeling:"afraid", emoji:"😱" },
    { text: "Someone is not listening to me and I feel frustrated.", feeling:"angry", emoji:"😡" }

  ];

  let available = all.filter(s => !usedScenarios.includes(s.text));

  if (available.length === 0) {
    usedScenarios = [];
    available = all;
  }

  const chosen = random(available);
  usedScenarios.push(chosen.text);

  return {
    ...chosen,
    process: [
      "Pause and take a breath",
      "Notice what I’m feeling",
      "Give myself time to think"
    ],
    choices: [
      { text:"Think before I act", type:"best" },
      { text:"Talk to someone I trust", type:"best" },
      { text:"Ignore how I feel", type:"okay" },
      { text:"React immediately", type:"worst" },
      { text:"Blame someone else", type:"worst" }
    ]
  };
}
</script>

</body>
</html>
