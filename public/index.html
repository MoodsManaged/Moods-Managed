<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  color: white;
  background: radial-gradient(circle, #2c2f6b, #0d0f2e);
  transition: background 1s ease;
}

h1 {
  font-size: 55px;
  color: gold;
}

#avatar {
  font-size: 90px;
  margin: 20px;
}

#scenario h2 {
  font-size: 32px;
}

#scenario p {
  font-size: 28px;
}

/* 🎴 CARD CONTAINER */
#cards {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin: 40px;
  flex-wrap: wrap;
}

/* 🎴 CARD BASE */
.card {
  width: 240px;
  height: 360px;
  perspective: 1000px;
}

/* FLIP STRUCTURE */
.card-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}

.card.flipped .card-inner {
  transform: rotateY(180deg);
}

/* FRONT + BACK */
.card-front, .card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  border-radius: 20px;
  backface-visibility: hidden;

  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
  text-align: center;
  font-size: 20px;
}

/* FRONT BASE */
.card-front {
  background: linear-gradient(145deg, #1b1d47, #2a2f85);
  box-shadow: 0 0 25px rgba(0,0,0,0.7);
}

/* BACK SIDE */
.card-back {
  background: #111;
  transform: rotateY(180deg);
  font-size: 26px;
}

/* 🎨 STAGE COLORS */

/* PROCESSING = BLUE */
.processing .card-front {
  border: 3px solid #3a86ff;
  box-shadow: 0 0 25px #3a86ff;
}

/* DECISION = GOLD */
.decision .card-front {
  border: 3px solid gold;
  box-shadow: 0 0 30px gold;
}

/* COPING = GREEN */
.coping .card-front {
  border: 3px solid #06d6a0;
  box-shadow: 0 0 30px #06d6a0;
}

.start-button {
  padding: 20px 40px;
  font-size: 24px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
  <button class="start-button" onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
  <div id="avatar"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>

// ===== STATE =====
let usedScenarios=[];

// ===== DATA =====
const characters=["⚔️","🧙","🐉","👑","🦄"];

const emotionGroups={
  angry:["angry"],
  scared:["scared"],
  sad:["sad"],
  happy:["happy"],
  calm:["calm"],
  strong:["confident"]
};

const emotionColors={
  angry:"#ff4b5c",
  scared:"#845ef7",
  sad:"#6c757d",
  happy:"#ffd166",
  calm:"#118ab2",
  strong:"#06d6a0"
};

const copingByEmotion={
  scared:["Breathe slowly","Stay safe","Look around"],
  angry:["Walk","Move","Step away"],
  sad:["Talk","Cry","Hug"],
  happy:["Play","Share","Smile"],
  calm:["Relax","Read","Breathe"],
  strong:["Try","Lead","Go for it"]
};

const processingActions=[
  "Pause and breathe","Notice what I feel","Slow things down",
  "Ask what I need","Take a moment","Observe carefully",
  "Check in with myself","Think before acting",
  "Remind myself this will pass","Stay still for a moment"
];

// ===== CARD CREATOR =====
function createCard(text, stage, next) {

  const card=document.createElement("div");
  card.className="card " + stage;

  const inner=document.createElement("div");
  inner.className="card-inner";

  const front=document.createElement("div");
  front.className="card-front";
  front.innerHTML=text;

  const back=document.createElement("div");
  back.className="card-back";
  back.innerHTML="✓";

  inner.appendChild(front);
  inner.appendChild(back);
  card.appendChild(inner);

  card.onclick=()=>{
    card.classList.add("flipped");
    setTimeout(next, 500);
  };

  return card;
}

// ===== START =====
function startGame(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("game").style.display="block";
  nextScenario();
}

// ===== MAIN LOOP =====
function nextScenario(){

  const avatar=document.getElementById("avatar");
  avatar.innerHTML=characters[Math.random()*characters.length|0];

  const s=generateScenario();

  document.body.style.background=
    `radial-gradient(circle, ${emotionColors[s.emotion.type]}, #111)`;

  window.currentEmotion=s.emotion.type;

  document.getElementById("scenario").innerHTML=`
    <h2>${s.text}</h2>
    <p>💭 I feel <b>${s.emotion.word}</b></p>
  `;

  const cards=document.getElementById("cards");
  cards.innerHTML="";

  // ✅ PROCESSING STAGE
  const options = processingActions
    .sort(()=>Math.random()-0.5)
    .slice(0,4);

  options.forEach(t=>{
    cards.appendChild(createCard(t, "processing", showDecision));
  });
}

// ===== DECISION =====
function showDecision(){
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  ["Pause and think","Ask for help","Ignore it","React instantly"]
    .sort(()=>Math.random()-0.5)
    .forEach(t=>{
      cards.appendChild(createCard(t, "decision", showCoping));
    });
}

// ===== COPING =====
function showCoping(){
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  copingByEmotion[window.currentEmotion]
    .sort(()=>Math.random()-0.5)
    .slice(0,4)
    .forEach(t=>{
      cards.appendChild(createCard(t, "coping", ()=>{
        cards.innerHTML="<p>💚 Good choice</p>";
        setTimeout(nextScenario,1000);
      }));
    });
}

// ===== SCENARIOS =====
function generateScenario(){

const scenarios=[
  {text:"My wing is broken and I cannot fly",type:"sad"},
  {text:"Something feels scary around me",type:"scared"},
  {text:"Something is unfair",type:"angry"},
  {text:"I did something amazing",type:"strong"},
  {text:"Everything feels calm",type:"calm"},
  {text:"I am having fun",type:"happy"}
];

const chosen=scenarios[Math.random()*scenarios.length|0];

return {
  text: chosen.text,
  emotion:{
    type:chosen.type,
    word:emotionGroups[chosen.type][0]
  }
};

}

</script>

</body>
</html>
