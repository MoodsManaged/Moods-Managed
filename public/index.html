<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<script src="game.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle, #2c2f6b, #0d0f2e);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 80px;
  font-size: 65px;
  color: gold;
  text-shadow: 0 0 25px gold;
}

/* MENU BUTTONS */
button {
  background: gold;
  border: none;
  padding: 15px 25px;
  margin: 15px;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
  box-shadow: 0 0 10px gold;
}

/* GAME AREA */
#game {
  display: none;
}

/* ✅ HORIZONTAL ROW */
#cards {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 40px;
  flex-wrap: wrap;
}

/* ✅ ROBLOX STYLE CARD */
.card {
  background: linear-gradient(145deg, #23256b, #1b1d47);
  color: white;
  width: 220px;
  padding: 25px;
  border-radius: 20px;
  cursor: pointer;

  box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  transition: all 0.2s ease;
}

/* HOVER EFFECT */
.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 40px gold;
}

/* ✅ AVATAR EMOJI */
.avatar {
  font-size: 40px;
  margin-bottom: 10px;
}

/* TEXT */
.choice-text {
  font-size: 16px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Mode</h2>

<div id="menu">
  <button onclick="startGame()">🏰 Story Mode</button>
  <button onclick="startGame()">🎮 Single Player</button>
  <button onclick="startMulti()">🌐 Multiplayer</button>
</div>

<div id="game">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<div id="multiplayer" style="display:none;">
  <h2>🌐 Multiplayer Mode</h2>
</div>

<script>
function startGame() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";
  nextScenario();
}

function startMulti() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("multiplayer").style.display = "block";
}
</script>

</body>
</html>
