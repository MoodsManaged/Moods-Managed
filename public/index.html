<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: radial-gradient(circle at center, #2c2f75, #0a0c25);
      color: white;
      text-align: center;
      perspective: 1000px;
    }

    h1 {
      font-size: 48px;
      color: gold;
      margin: 20px;
      text-shadow: 0 0 20px gold;
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    #scenario {
      background: #2b2e6e;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .card {
      width: 140px;
      height: 180px;
      background: linear-gradient(145deg, #6d5cff, #3c3492);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 10px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 20px black;
    }

    .card:hover {
      transform: scale(1.1) rotateY(10deg);
      box-shadow: 0 0 20px gold;
    }

    button {
      padding: 12px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      background: gold;
      cursor: pointer;
    }

    #stats {
      background: #11144a;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="game">

  <div id="modeScreen">
    <h2>Choose Mode</h2>
    <button onclick="startStory()">🏰 Story Mode</button>
  </div>

  <div id="stats"></div>

  <div id="scenario"></div>

  <h3>Your Choices</h3>
  <div id="cards"></div>

  <p id="info"></p>

</div>

script.js
</body>
</html>
