<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      text-align: center;
      color: white;

      background: radial-gradient(circle at center, #2c2f6b, #0d0f2e);
      transition: background 1s ease;
    }

    h1 {
      margin-top: 30px;
      font-size: 55px;
      color: gold;
      text-shadow: 0 0 25px gold;
    }

    /* ✅ AVATAR */
    #avatar {
      font-size: 90px;
      margin: 20px;
    }

    /* 🎭 ANIMATIONS */

    .angry {
      animation: shake 0.2s infinite;
    }

    @keyframes shake {
      0%{transform:translateX(-3px);}
      50%{transform:translateX(3px);}
      100%{transform:translateX(-3px);}
    }

    .scared {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%{transform:scale(1);}
      50%{transform:scale(1.1);}
      100%{transform:scale(1);}
    }

    .sad {
      opacity: 0.6;
      transform: scale(0.9);
    }

    .happy {
      animation: bounce 0.6s infinite alternate;
    }

    @keyframes bounce {
      from{transform:translateY(0);}
      to{transform:translateY(-10px);}
    }

    .calm {
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%{transform:translateY(0);}
      50%{transform:translateY(-5px);}
      100%{transform:translateY(0);}
    }

    .strong {
      transform: scale(1.2);
    }

    #scenario {
      margin: 20px;
    }

    #cards {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 40px;
      flex-wrap: wrap;
    }

    .card {
      width: 320px;
      padding: 35px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 20px;

      background: linear-gradient(145deg, #1b1d47, #2a2f85);
      box-shadow: 0 0 20px rgba(0,0,0,0.6);

      transition: 0.25s;
    }

    .card:hover {
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255,255,255,0.5);
    }

    #startScreen {
      margin-top: 100px;
    }

    .start-button {
      padding: 20px 40px;
      font-size: 22px;
      border-radius: 15px;
      cursor: pointer;
      background: #2a2f85;
      color: white;
      border: none;
    }

  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
  <p>Welcome to your emotional quest.</p>
  <button class="start-button" onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
  <div id="avatar"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>

// ===== STATE =====
let usedScenarios=[];

// ✅ EMOTIONS
const emotionGroups={
  angry:["angry","furious"],
  scared:["anxious","panicked"],
  sad:["sad","lonely"],
  happy:["happy","joyful"],
  calm:["calm","peaceful"],
  strong:["confident","brave"]
};

// ✅ EMOTION COLORS
const emotionColors={
  angry:"#ff4b5c",
  scared:"#845ef7",
  sad:"#6c757d",
  happy:"#ffd166",
  calm:"#118ab2",
  strong:"#06d6a0"
};

// ✅ CHARACTERS
const characters=["⚔️","🧙","🐉","👑","🧑","🦄"];

// ✅ START
function startGame(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("game").style.display="block";
  nextScenario();
}

// ✅ MAIN LOOP
function nextScenario(){

  const avatar=document.getElementById("avatar");

  // pick random character
  avatar.className="";
  avatar.innerHTML=characters[Math.floor(Math.random()*characters.length)];

  const s=generateScenario();

  // ✅ APPLY COLOR
  document.body.style.background=
    `radial-gradient(circle, ${emotionColors[s.emotion.type]}, #0d0f2e)`;

  // ✅ APPLY ANIMATION CLASS
  avatar.classList.add(s.emotion.type);

  window.currentEmotion=s.emotion.type;

  document.getElementById("scenario").innerHTML=`
    <h2>${s.text}</h2>
    <p>💭 I feel <b>${s.emotion.word}</b></p>
  `;

  const cards=document.getElementById("cards");
  cards.innerHTML="";

  ["Pause","Notice","Think"].forEach(c=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=c;
    el.onclick=showDecision;
    cards.appendChild(el);
  });
}

// ✅ DECISION
function showDecision(){
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  ["Pause and think","Ask for help","Ignore it","React instantly"]
    .sort(()=>Math.random()-0.5)
    .forEach(t=>{
      const el=document.createElement("div");
      el.className="card";
      el.innerHTML=t;
      el.onclick=showCoping;
      cards.appendChild(el);
    });
}

// ✅ COPING
const copingByEmotion={
  scared:["Breathe slowly","Stay safe","Look around"],
  angry:["Walk","Breathe","Move"],
  sad:["Talk","Cry","Hug"],
  happy:["Play","Smile","Share"],
  calm:["Relax","Read"],
  strong:["Try","Lead"]
};

function showCoping(){
  const cards=document.getElementById("cards");
  cards.innerHTML="";

  copingByEmotion[window.currentEmotion]
    .sort(()=>Math.random()-0.5)
    .slice(0,4)
    .forEach(c=>{
      const el=document.createElement("div");
      el.className="card";
      el.innerHTML=c;
      el.onclick=()=>{
        cards.innerHTML="<p>💚 Good choice</p>";
        setTimeout(nextScenario,1500);
      };
      cards.appendChild(el);
    });
}

// ✅ SCENARIOS
function generateScenario(){

const scenarios=[
  {text:"My wing is broken and I cannot fly",type:"sad"},
  {text:"I am going somewhere new",type:"scared"},
  {text:"I hear something scary",type:"scared"},
  {text:"Someone is mean to me",type:"angry"},
  {text:"Something is unfair",type:"angry"},
  {text:"I did something great",type:"strong"},
  {text:"Everything feels calm",type:"calm"},
  {text:"I am having fun",type:"happy"}
];

let available=scenarios.filter(s=>!usedScenarios.includes(s.text));
if(available.length===0){usedScenarios=[];available=scenarios;}

const chosen=available[Math.floor(Math.random()*available.length)];
usedScenarios.push(chosen.text);

const emo=emotionGroups[chosen.type];

return{
  text:chosen.text,
  emotion:{
    type:chosen.type,
    word:emo[Math.floor(Math.random()*emo.length)]
  }
};

}

</script>

</body>
</html>
