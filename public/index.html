<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:#1a1c4b;
}

h1{font-size:50px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:28px;}
#scenario p{font-size:22px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:30px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let step = 0;

// ===== CHARACTERS
const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ===== UNIQUE EMOTIONS (50)
const emotionWords = [
"anxious","nervous","panicked","uneasy","overwhelmed",
"angry","furious","frustrated","irritated","annoyed",
"sad","lonely","hurt","down","hopeless",
"happy","joyful","excited","playful","cheerful",
"calm","peaceful","relaxed","steady","safe",
"confident","brave","capable","proud","strong",
"worried","tense","startled","shocked","uncertain",
"disappointed","excluded","heavy","empty","quiet",
"thrilled","energised","hopeful","curious","inspired",
"grounded","balanced","clear","focused","stable"
];

// ===== UNIQUE SCENARIOS (50 MATCHED)
const scenarios = [
{text:"I hear something moving behind me in the dark"},
{text:"The lights suddenly go out"},
{text:"A loud crash startles me"},
{text:"I feel unsafe walking somewhere new"},
{text:"Something moves unexpectedly nearby"},

{text:"Someone treats me unfairly"},
{text:"Someone says something rude to me"},
{text:"I get blamed for something I didn’t do"},
{text:"Someone interrupts me"},
{text:"My effort is ignored"},

{text:"I’m left out of a group"},
{text:"A friend stops talking to me"},
{text:"Something important didn’t work out"},
{text:"I lose something meaningful"},
{text:"I feel alone in a crowd"},

{text:"I finish something difficult"},
{text:"I help someone succeed"},
{text:"I solve something on my own"},
{text:"I overcome something hard"},
{text:"I keep going even when it’s tough"},

{text:"Everything feels calm and quiet"},
{text:"I sit peacefully with nothing to do"},
{text:"Nothing is rushing me"},
{text:"I feel steady and relaxed"},
{text:"I enjoy a quiet moment"},

{text:"I laugh with friends"},
{text:"Something exciting happens"},
{text:"I feel proud of myself"},
{text:"I celebrate something"},
{text:"I enjoy a really fun moment"},

{text:"I face something unexpected"},
{text:"Something surprises me suddenly"},
{text:"A situation changes quickly"},
{text:"I feel unsure what will happen"},
{text:"I hesitate before acting"},

{text:"Someone misunderstands me"},
{text:"I feel overlooked"},
{text:"Something doesn’t go my way"},
{text:"Plans don’t work out"},
{text:"I feel disconnected"},

{text:"I succeed at something new"},
{text:"I take initiative"},
{text:"I challenge myself"},
{text:"I improve at something"},
{text:"I take the lead"},

{text:"I slow down and breathe"},
{text:"I sit quietly observing"},
{text:"I enjoy silence"},
{text:"I feel balanced"},
{text:"I stay present"
}
];

// ===== UNIQUE COPING (50)
let copingPool = [
"Take slow deep breaths","Look around carefully","Find a safe place","Talk to someone","Ground yourself",
"Move your body","Take space","Release tension","Step outside","Reset yourself",
"Talk it out","Allow yourself to cry","Rest","Be kind to yourself","Sit quietly",
"Enjoy the moment","Share it","Celebrate","Smile","Stay present",
"Relax deeply","Read something calming","Take your time","Breathe slowly","Stay steady",
"Keep going","Try again","Help someone","Stay strong","Keep building",
"Drink water","Stretch your body","Take a walk","Pause physically","Calm down slowly",
"Listen to music","Write your thoughts","Focus on senses","Count your breaths","Sit still",
"Watch your thoughts","Let it pass","Stay aware","Comfort yourself","Reset gently",
"Take control","Center yourself","Slow everything down","Stay focused","Let yourself settle"
];

// ===== PROCESSING (emotion-neutral but varied)
const processingPool = [
"Wait… what’s happening right now?",
"Pause for a second.",
"What am I feeling?",
"Don’t rush this.",
"I need a moment.",
"Let me think first.",
"Slow this down.",
"What do I need here?",
"Take a breath first.",
"Step back mentally."
];

// ===== CARD
function makeCard(text,next){
const c=document.createElement("div");
c.className="card";

const inner=document.createElement("div");
inner.className="inner";

const front=document.createElement("div");
front.className="front";
front.innerHTML=text;

const back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ===== NEXT
function next(){

if(step>=50){
endGame();
return;
}

// ✅ REMOVE used items (NO REUSE EVER)
const scenario = scenarios.splice(Math.floor(Math.random()*scenarios.length),1)[0];
const emotion = emotionWords.splice(Math.floor(Math.random()*emotionWords.length),1)[0];

// ✅ coping unique pull (5 per scenario)
let copingChoices=[];
for(let i=0;i<5;i++){
copingChoices.push(copingPool.splice(Math.floor(Math.random()*copingPool.length),1)[0]);
}

let round = Math.floor(step/5)+1;
let scenarioNum = (step%5)+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

document.getElementById("scenario").innerHTML=
`<h2>${scenario.text}</h2><p>I feel <b>${emotion}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

// PROCESSING
processingPool.forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

// COPING STAGE
function showCoping(){

c.innerHTML="";

copingChoices.forEach(x=>{
c.appendChild(makeCard(x,()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});

}

}

// ===== START
function startGame(){
step=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 All 50 completed. Nothing repeated.</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
