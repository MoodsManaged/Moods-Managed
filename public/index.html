<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      background: radial-gradient(circle, #2c2f6b, #0d0f2e);
      color: white;
      text-align: center;
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h1 {
      margin-top: 50px;
      font-size: 55px;
      color: gold;
      text-shadow: 0 0 25px gold;
    }

    #cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 40px;
      flex-wrap: wrap;
    }

    .card {
      background: #1b1d47;
      width: 230px;
      padding: 20px;
      border-radius: 15px;
      cursor: pointer;
      transition: 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .role-button {
      padding: 15px;
      margin: 10px;
      border-radius: 15px;
      cursor: pointer;
      background: #2a2f85;
      color: white;
      border: none;
    }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Your Role</h2>

<div id="menu">
  <button class="role-button" onclick="startGame('knight')">⚔️ Knight</button>
  <button class="role-button" onclick="startGame('mage')">🧙 Mage</button>
  <button class="role-button" onclick="startGame('dragon')">🐉 Dragon</button>
</div>

<div id="game" style="display:none;">
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>

// ===== BASIC =====
let role = "";
let level = 1;
let unrest = 0;
let usedScenarios = [];

// ===== ROLES =====
const roles = {
  knight: "⚔️ Knight",
  mage: "🧙 Mage",
  dragon: "🐉 Dragon"
};

// ===== EMOTIONS =====
const emotionGroups = {
  angry: ["angry","frustrated","irritated","annoyed","furious","jealous"],
  scared: ["anxious","nervous","worried","panicked","overwhelmed"],
  sad: ["sad","lonely","disappointed","hopeless","tired"],
  happy: ["happy","excited","joyful","cheerful"],
  calm: ["calm","peaceful","relaxed","safe"],
  strong: ["confident","brave","proud","resilient"]
};

function getRandomEmotion() {
  const keys = Object.keys(emotionGroups);
  const k = keys[Math.floor(Math.random()*keys.length)];
  return {
    type: k,
    word: emotionGroups[k][Math.floor(Math.random()*emotionGroups[k].length)]
  };
}

// ===== SMART COPING =====
const copingByEmotion = {

  angry: [
    "Take deep breaths","Go for a walk","Stretch","Write feelings","Listen to music","Step away","Rip paper","Kick a ball"
  ],

  scared: [
    "Slow breathing","Notice 5 things","Talk to someone","Sit somewhere safe","Wrap in blanket","Drink water","Look around carefully"
  ],

  sad: [
    "Talk to a friend","Write in a diary","Draw","Hug something","Listen to calm music","Let yourself cry","Write feelings"
  ],

  happy: [
    "Share with someone","Play a game","Dance","Smile","Enjoy the moment","Create something"
  ],

  calm: [
    "Stay present","Read a book","Relax","Enjoy quiet","Listen to music"
  ],

  strong: [
    "Set a goal","Help someone","Try something new","Encourage others","Practice skills"
  ]
};

function getCopingOptions(type) {
  return [...copingByEmotion[type]]
    .sort(() => Math.random() - 0.5)
    .slice(0,4);
}

// ===== START =====
function startGame(r) {
  role = r;
  level = 1;
  unrest = 0;
  usedScenarios = [];

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  nextScenario();
}

// ===== MAIN LOOP =====
function nextScenario() {

  if (unrest >= 5) {
    document.getElementById("game").innerHTML = "<h1>💥 Too much unrest...</h1>";
    return;
  }

  const s = generateScenario();
  window.currentEmotion = s.emotion.type;

  document.getElementById("scenario").innerHTML = `
    <h2>${s.text}</h2>
    <p>💭 I feel <b>${s.emotion.word}</b></p>
    <p>What should I do FIRST?</p>
  `;

  const container = document.getElementById("cards");
  container.innerHTML = "";

  ["Pause","Notice feeling","Think"]
    .forEach(c => {
      const el = document.createElement("div");
      el.className="card";
      el.innerHTML=c;
      el.onclick=showDecision;
      container.appendChild(el);
    });
}

// ===== DECISION =====
function showDecision() {
  const container = document.getElementById("cards");
  container.innerHTML="";

  const options = [
    {text:"Pause and think", v:1},
    {text:"Ask for help", v:1},
    {text:"Ignore it", v:0},
    {text:"React instantly", v:-1}
  ].sort(()=>Math.random()-0.5);

  options.forEach(o=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=o.text;

    el.onclick=()=>{
      if(o.v===1) level++;
      if(o.v===-1) unrest++;
      showCoping();
    };

    container.appendChild(el);
  });
}

// ===== COPING =====
function showCoping() {
  const container = document.getElementById("cards");
  container.innerHTML="";

  const options = getCopingOptions(window.currentEmotion);

  options.forEach(c=>{
    const el=document.createElement("div");
    el.className="card";
    el.innerHTML=c;
    el.onclick=()=>showFeedback();
    container.appendChild(el);
  });
}

// ===== FEEDBACK =====
function showFeedback() {
  document.getElementById("cards").innerHTML="<p>💚 Good choice</p>";
  setTimeout(nextScenario,1500);
}

// ===== ALL SCENARIOS =====
function generateScenario() {

const scenarios = [
"The little prince runs into his parents’ bedroom at night",
"The princess won't sit in front of a crowd",
"The knight gave up lessons",
"The king keeps calling the doctor",
"The dragon broke a wing",
"A villager goes to a new school",
"A dragon feels too small",
"A girl worries about making friends",
"A psychic was wrong",
"A wizard failed a spell",
"A prince hears parents arguing",
"A tornado might happen",
"A witch had a bad day",
"A friend argument happens",
"A horse is taken",
"A knight dislikes armour",
"A tutor changes",
"A necklace is lost",
"A boy not invited to a party",
"A race is lost",
"A dragon is sick",
"A child is bullied",
"A princess sees a parent crying",
"A teacher yells",
"A big shadow appears",
"A scary story is read",
"A sudden movement startles",
"Plans change suddenly",
"A child is redirected somewhere",
"A project unfinished",
"A reminder of a lost pet",
"A child is tired and must wait",
"A drawing fails",
"A child gets stuck writing",
"A sibling hits",
"A child repeats things",
"A unicorn gave up trying",
"A child is away from parents",
"A child dislikes touch while upset",
"A child can't go out",
"A dragon is teased",
"A coach criticizes publicly",
"A friend refuses to play",
"A fall happens",
"A child overwhelmed with tasks",
"A scary creature imagined",
"A spider crawls",
"A parent injured",
"A sibling gets more gifts",
"A teacher leaves",
"A class changes",
"A mouse runs",
"A game is unfair",
"A sibling uses something",
"A cake piece unfair",
"A loud door slam",
"A thunder crash",
"A child fears a mark",
"A cut is seen",
"A child is alone",
"A child wakes in darkness",
"A game taken away",
"A person not understood",
"A friend ignores requests",
"A child alone in room",
"A storm ruins event",
"A child fails and fears trying",
"A child fears life won't be interesting",
"A child doubts abilities",
"A snake appears",
"A parade cancelled",
"A team not made",
"A race might not be won",
"A test might fail",
"A child wishes to be someone else"
];

let available = scenarios.filter(s=>!usedScenarios.includes(s));
if(available.length===0){usedScenarios=[];available=scenarios;}

const text = available[Math.floor(Math.random()*available.length)];
usedScenarios.push(text);

return {
  text:"As "+roles[role]+", "+text,
  emotion:getRandomEmotion()
};

}

</script>

</body>
</html>
