<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
  body {
    background: radial-gradient(circle, #2c2f6b, #0d0f2e);
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
  }

  h1 {
    margin-top: 50px;
    font-size: 55px;
    color: gold;
    text-shadow: 0 0 25px gold;
  }

  h2 {
    margin-top: 15px;
  }

  #stats {
    margin-top: 10px;
    font-size: 18px;
  }

  #cards {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 40px;
    flex-wrap: wrap;
  }

  .card {
    background: #1b1d47;
    width: 230px;
    padding: 20px;
    border-radius: 15px;
    cursor: pointer;
    transition: 0.2s;
  }

  .card:hover {
    transform: scale(1.05);
  }

  .role-button {
    padding: 15px;
    margin: 10px;
    border-radius: 15px;
    cursor: pointer;
    background: #2a2f85;
    color: white;
    border: none;
  }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Your Role</h2>

<div id="menu">
  <button class="role-button" onclick="startGame('knight')">⚔️ Knight</button>
  <button class="role-button" onclick="startGame('mage')">🧙 Mage</button>
  <button class="role-button" onclick="startGame('dragon')">🐉 Dragon</button>
</div>

<div id="game" style="display:none;">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>
let role = "";
let level = 1;
let unrest = 0;

let usedScenarios = [];
let usedGood = [];
let usedBad = [];
let usedProcess = [];
let usedChoices = [];

const roles = {
  knight: "⚔️ Knight",
  mage: "🧙 Mage",
  dragon: "🐉 Dragon"
};

const reactions = {
  knight: {
    good: "🛡️ I steady myself and lead with control.",
    bad: "⚠️ I act too quickly without thinking."
  },
  mage: {
    good: "🔮 I focus and regain balance.",
    bad: "💥 My energy feels out of control."
  },
  dragon: {
    good: "🐉 I breathe slowly... my fire calms.",
    bad: "🔥 My anger bursts out uncontrollably."
  }
};

const goodFeedback = [
  "That helps me pause and think first.",
  "That gives me space to understand what I’m feeling.",
  "That helps me stay in control.",
  "That’s a thoughtful way to handle this.",
  "That supports managing my feelings safely.",
  "That helps me respond instead of react."
];

const badFeedback = [
  "That might make things harder for me.",
  "That could make my feeling stronger.",
  "That doesn’t give me time to think.",
  "That might lead to losing control.",
  "That doesn’t help manage what I’m feeling.",
  "That could make the situation worse."
];

function randomNoRepeat(pool, used) {
  let available = pool.filter(p => !used.includes(p));
  if (available.length === 0) {
    used.length = 0;
    available = pool;
  }
  const choice = available[Math.floor(Math.random() * available.length)];
  used.push(choice);
  return choice;
}

function startGame(r) {
  role = r;
  level = 1;
  unrest = 0;

  usedScenarios = [];
  usedGood = [];
  usedBad = [];
  usedProcess = [];
  usedChoices = [];

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  nextScenario();
}

function nextScenario() {
  if (unrest >= 5) {
    document.getElementById("game").innerHTML = `
      <h1>💥 I caused too much unrest...</h1>
      <p>I overthrew the kingdom 👑</p>
      <p>Now I am trapped here forever.</p>
    `;
    return;
  }

  const s = generateScenario();

  document.getElementById("scenario").innerHTML = `
    <h2>${s.text}</h2>
    <p>${s.emoji} I feel <b>${s.feeling}</b></p>
    <p>💭 What should I do FIRST?</p>
  `;

  document.getElementById("stats").innerHTML =
    `${roles[role]} | ⭐ Level ${level} | ⚠️ Unrest ${unrest}`;

  const container = document.getElementById("cards");
  container.innerHTML = "";

  s.process.forEach(c => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = c;
    el.onclick = () => showDecision(s);
    container.appendChild(el);
  });
}

function showDecision(s) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  document.getElementById("scenario").innerHTML +=
    "<p>✅ Now what is the best way for me to handle this?</p>";

  s.choices.forEach(c => createCard(c.text, c.type));
}

function createCard(text, type) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = text;

  el.onclick = () => {
    let msg;

    if (type === "best") {
      level++;
      msg = randomNoRepeat(goodFeedback, usedGood);
    } else if (type === "okay") {
      msg = "That might help a little, but there could be a stronger option.";
    } else {
      unrest++;
      msg = randomNoRepeat(badFeedback, usedBad);
    }

    showFeedback(msg, reactions[role][type === "worst" ? "bad" : "good"]);
  };

  document.getElementById("cards").appendChild(el);
}

function showFeedback(text, reaction) {
  const msg = document.createElement("div");
  msg.innerHTML = `<p>${reaction}</p><p>${text}</p>`;
  msg.style.marginTop = "20px";

  document.getElementById("cards").appendChild(msg);

  setTimeout(nextScenario, 2000);
}

function generateScenario() {

  const scenarios = [
    { text: "Everything is happening at once and I feel overwhelmed.", feeling:"overwhelmed", emoji:"😵‍💫" },
    { text: "No one is listening to me and I feel frustrated.", feeling:"frustrated", emoji:"😤" },
    { text: "I need to do something important and I feel nervous.", feeling:"nervous", emoji:"😰" },
    { text: "Something didn’t go how I hoped and I feel disappointed.", feeling:"disappointed", emoji:"😞" },
    { text: "Something sudden happened and I feel scared.", feeling:"afraid", emoji:"😱" },
    { text: "I made a mistake and now I feel upset.", feeling:"sad", emoji:"😢" }
  ];

  let available = scenarios.filter(s => !usedScenarios.includes(s.text));
  if (available.length === 0) {
    usedScenarios = [];
    available = scenarios;
  }

  const chosen = available[Math.floor(Math.random() * available.length)];
  usedScenarios.push(chosen.text);

  const processOptions = [
    ["Pause and take a breath", "Notice what I’m feeling", "Give myself time to think"],
    ["Slow down my body", "Name the feeling", "Take a moment"],
    ["Stop and breathe", "Recognize what’s happening", "Think before acting"]
  ];

  const choiceOptions = [
    [
      { text:"Take a breath before acting", type:"best" },
      { text:"Talk to someone I trust", type:"best" },
      { text:"Ignore it", type:"okay" },
      { text:"React immediately", type:"worst" },
      { text:"Blame someone else", type:"worst" }
    ],
    [
      { text:"Pause and think it through", type:"best" },
      { text:"Ask for help", type:"best" },
      { text:"Push the feeling away", type:"okay" },
      { text:"Act without thinking", type:"worst" },
      { text:"Shout right away", type:"worst" }
    ]
  ];

  const process = randomNoRepeat(processOptions, usedProcess);
  const choices = randomNoRepeat(choiceOptions, usedChoices);

  return {
    ...chosen,
    process,
    choices
  };
}
</script>

</body>
</html>
``
