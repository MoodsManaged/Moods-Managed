<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background: radial-gradient(circle,#2c2f6b,#0d0f2e);
}

h1{font-size:55px;color:gold;}

#avatar{font-size:90px;margin:20px;}

#scenario h2{font-size:30px;}
#scenario p{font-size:26px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin:40px;
}

.card{
width:230px;
height:340px;
perspective:1000px;
cursor:pointer;
}

.card-inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flipped .card-inner{transform:rotateY(180deg);}

.card-front,.card-back{
position:absolute;
width:100%;
height:100%;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.card-front{background:#2a2f85;}
.card-back{background:#111;transform:rotateY(180deg);}

.processing .card-front{border:3px solid #3a86ff;}
.decision .card-front{border:3px solid gold;}
.coping .card-front{border:3px solid #06d6a0;}

button{
padding:14px 28px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="roundInfo"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

// ===== GAME STATE =====
let round = 0;
let scenarioIndex = 0;
let score = 0;

const chars = ["⚔️","🧙","🐉","👑","🦄","🐺"];

// ===== EMOTION WORDS (50 UNIQUE)
const allEmotionWords = [
"anxious","nervous","scared","panicked","overwhelmed",
"angry","furious","frustrated","irritated","annoyed",
"sad","lonely","down","hopeless","tired",
"happy","joyful","excited","playful","cheerful",
"calm","peaceful","relaxed","safe","content",
"confident","brave","strong","proud","capable",
"worried","uneasy","tense","startled","shocked",
"hurt","disappointed","excluded","empty","quiet",
"energised","thrilled","curious","hopeful","inspired",
"focused","grounded","steady","balanced","clear"
];

// ===== 50 SCENARIOS =====
const allScenarios = allEmotionWords.map((e,i)=>({
text:[
"I hear something in the dark",
"Someone says something unfair",
"I feel left out",
"I achieve something important",
"I enjoy a calm moment"
][i%5],
emotion:e
}));

// ===== PROCESSING (50 total → 5 per round)
const processingAll = [
"Wait… what’s going on?","Pause for a second",
"What am I feeling?","Look around carefully","Take a breath",
"Think before reacting","Don’t rush","Stay calm","Check in with myself",
"Hold on a second","Let’s slow this down","Be curious","Notice my body",
"Let me think","Take a step back","Observe first","Stay present","Breathe slowly",
"What do I need?","Keep control","Focus here","Give it a moment",
"Let this settle","Think clearly","Pause before reacting",
"Step back mentally","Ground myself","Stay aware","Slow everything down",
"Don’t react yet","Take space mentally","Check perspective",
"Stabilize myself","Stay steady","Re-center","Take a pause",
"Stay present here","Feel it out","Stay mindful","Be aware",
"Let me process","Focus inward","Let it pass","Check my thoughts",
"Stay composed","Observe calmly","Stay in control","Think it through",
"Pause deliberately"
];

// ===== DECISIONS (50 total → 5 per round)
const decisionAll = [
"I should take a breath first.","Maybe pause before reacting.",
"Think this through.","Stay calm here.","Make a better choice.",
"Wait it out.","Ignore for now.","Step away.","Delay reaction.","Let it go.",
"Act quickly.","React now.","Blame someone.","Snap instantly.","Rush it.",
"Choose carefully.","Handle this calmly.","Take control.","Stay aware.","Decide slowly.",
"See what happens.","Walk away silently.","Keep it inside.",
"Overreact.","Say something harsh.","Push aggressively.",
"Be thoughtful.","Respond with care.","Slow response.","Reflect first.",
"Do nothing.","Avoid it.","Distract myself.",
"Escalate it.","Get defensive.","Blurt it out.",
"Consider options.","Take responsibility.","Make a smart choice.",
"Wait calmly.","Watch closely.","Process first.",
"Act rashly.","Jump to conclusions.","Shut down."
];

// ===== COPING (50 total → 5 per round)
const copingAll = [
"Let’s take slow breaths.","I can ground myself.",
"Find a safe space.","Talk to someone.","Look around calmly",
"Move my body.","Take space.","Release tension.","Breathe deeply","Pause and reset",
"Talk it out.","Cry if needed.","Rest for a bit.","Be kind to myself.","Sit quietly",
"Enjoy this moment.","Share it.","Celebrate it.","Smile.","Stay in it",
"Relax fully.","Stay present.","Read quietly.","Breathe steadily","Enjoy calm",
"Take initiative.","Try something new.","Help someone.","Keep going.","Stay strong",
"Drink water.","Pause physically.","Focus on senses.","Count slowly","Step outside",
"Write it down.","Listen to music.","Stretch","Slow walk","Deep inhale",
"Watch thoughts.","Let it pass.","Stay aware","Self comfort","Reset gently"
];

// ===== UTILITY: SLICE BY ROUND
function sliceRound(array){
return array.slice(round*5, round*5+5);
}

// ===== CARD
function card(text,stage,next,scoreType){

const c=document.createElement("div");
c.className="card "+stage;

const inner=document.createElement("div");
inner.className="card-inner";

const front=document.createElement("div");
front.className="card-front";
front.innerHTML=text;

const back=document.createElement("div");
back.className="card-back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flipped");

if(scoreType==="best") score+=2;
if(scoreType==="okay") score+=1;

setTimeout(next,500);
};

return c;
}

// ===== START
function startGame(){
round=0;
scenarioIndex=0;
score=0;

document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";

nextScenario();
}

// ===== NEXT SCENARIO
function nextScenario(){

if(round>=10){
endGame();
return;
}

const currentRoundScenarios = sliceRound(allScenarios);

if(!currentRoundScenarios[scenarioIndex]){
round++;
scenarioIndex=0;
return nextScenario();
}

const s = currentRoundScenarios[scenarioIndex];

document.getElementById("roundInfo").innerHTML =
`Round ${round+1}/10 – Scenario ${scenarioIndex+1}/5 – Score: ${score}`;

document.getElementById("avatar").innerHTML =
chars[Math.random()*chars.length|0];

document.getElementById("scenario").innerHTML =
`<h2>${s.text}</h2><p>💭 I feel <b>${s.emotion}</b></p>`;

const cards=document.getElementById("cards");
cards.innerHTML="";

// processing set per round
sliceRound(processingAll).forEach(t=>{
cards.appendChild(card(t,"processing",()=>showDecision(s)));
});

}

// ===== DECISION
function showDecision(s){

const cards=document.getElementById("cards");
cards.innerHTML="";

sliceRound(decisionAll).forEach((t,i)=>{

let type = i<2 ? "best" : i===2 ? "okay" : "worst";

cards.appendChild(card(t,"decision",()=>showCoping(s),type));
});

}

// ===== COPING
function showCoping(s){

const cards=document.getElementById("cards");
cards.innerHTML="";

sliceRound(copingAll).forEach(c=>{
cards.appendChild(card(c,"coping",()=>{
scenarioIndex++;
cards.innerHTML = `
<p>✅ That worked.</p>
<button onclick="nextScenario()">➡️ GO TO NEXT SCENARIO</button>
`;
}));
});

}

// ===== END GAME
function endGame(){

document.getElementById("cards").innerHTML="";

document.getElementById("scenario").innerHTML=
`<h2>🎉 You completed all 50 scenarios.</h2>
<p>Final Score: ${score}</p>
<button onclick="startGame()">Play Again</button>`;
}

</script>

</body>
</html>
``
