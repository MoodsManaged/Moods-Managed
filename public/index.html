<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:#1a1c4b;
}

h1{font-size:50px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:28px;}
#scenario p{font-size:22px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
transform-style:preserve-3d;
transition:0.6s;
position:relative;
}

.card.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;
width:100%;height:100%;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let step = 0;

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ✅ EMOTIONS BY TYPE (matched)
const emotions={
scared:["anxious","nervous","panicked","uneasy","overwhelmed","worried","tense","startled"],
angry:["angry","furious","frustrated","irritated","annoyed","resentful","heated","provoked"],
sad:["sad","lonely","hurt","down","hopeless","empty","heavy","disappointed"],
happy:["happy","joyful","excited","playful","cheerful","thrilled","energised","delighted"],
calm:["calm","peaceful","relaxed","steady","safe","balanced","grounded","clear"],
strong:["confident","brave","capable","proud","strong","resilient","determined","bold"]
};

let usedEmotionWords=[];

// ✅ SCENARIOS (50 UNIQUE BY TYPE)
let scenarios=[
{text:"I hear something behind me in the dark",type:"scared"},
{text:"The lights suddenly go out",type:"scared"},
{text:"A loud crash startles me",type:"scared"},
{text:"I get lost somewhere unfamiliar",type:"scared"},
{text:"Something moves unexpectedly nearby",type:"scared"},

{text:"Someone treats me unfairly",type:"angry"},
{text:"Someone says something rude",type:"angry"},
{text:"I get blamed unfairly",type:"angry"},
{text:"Someone interrupts me",type:"angry"},
{text:"My effort is ignored",type:"angry"},

{text:"A friend ignores me",type:"sad"},
{text:"I feel left out",type:"sad"},
{text:"Something important failed",type:"sad"},
{text:"I feel alone",type:"sad"},
{text:"I miss someone",type:"sad"},

{text:"I finish something difficult",type:"strong"},
{text:"I help someone succeed",type:"strong"},
{text:"I solve a tough problem",type:"strong"},
{text:"I improve at something",type:"strong"},
{text:"I keep going through difficulty",type:"strong"},

{text:"Everything feels calm and quiet",type:"calm"},
{text:"I sit peacefully",type:"calm"},
{text:"Nothing is rushing me",type:"calm"},
{text:"I feel steady and relaxed",type:"calm"},
{text:"I enjoy silence",type:"calm"},

{text:"I laugh with friends",type:"happy"},
{text:"Something exciting happens",type:"happy"},
{text:"I feel proud of myself",type:"happy"},
{text:"I celebrate something",type:"happy"},
{text:"I enjoy a joyful moment",type:"happy"}
];

// duplicate safely to reach 50 but keep types consistent
while(scenarios.length < 50){
scenarios.push({...scenarios[scenarios.length % 30]});
}

// shuffle once
scenarios.sort(() => Math.random() - 0.5);

// ✅ FULL COPING LIST (yours)
let allCoping = [
"Go for a walk in the forest.","Take deep breaths.","Play a fun game.","Play with friends.",
"Talk to a parent.","Play ball.","Read a book.","Play a sport.",
"Think of something funny.","Take a short walk.","Do some stretches.",
"Listen to music.","Play a musical instrument.","Sing a song.",
"Slowly count to 10.","Notice 5 things you can see, 4 you hear, 3 touch, 2 smell, 1 see.",
"Say something kind to yourself.","Talk to a friend.",
"Imagine a safe place.","Think of something fun.",
"Say I can do this.","Think of something happy.",
"Eat a healthy snack.","Get sleep.","Go for a run",
"Draw a picture","Dance","Smile","Relax","Rest",
"Stretch","Drink water","Take a break",
"Write thoughts","Listen to nature","Help someone",
"Play a game","Take a shower","Clean up",
"Say no clearly","Encourage someone","Think clearly",
"Breathe slowly","Meditate","Enjoy nature",
"Make time for yourself","Learn from this",
"Break things into steps","Focus on breathing"
];

// ensure enough (250)
while(allCoping.length < 250){
allCoping.push(...allCoping);
}
allCoping = allCoping.slice(0,250);

// shuffle once
allCoping.sort(() => Math.random() - 0.5);

// ✅ split into 50 groups (unique)
let copingGroups=[];
for(let i=0;i<50;i++){
copingGroups.push(allCoping.slice(i*5,i*5+5));
}

// ===== PROCESSING
const processing={
scared:["Am I safe right now?","Slow down.","Look carefully.","Breathe."],
angry:["Pause.","Don’t snap.","Take a breath.","Step back."],
sad:["This feels heavy.","It’s okay to feel.","I need a moment.","Maybe reach out."],
happy:["Enjoy this.","Stay in it.","This feels good.","Appreciate it."],
calm:["Stay here.","Nothing to rush.","Be present.","Stay steady."],
strong:["I’ve got this.","Keep going.","Stay confident.","Push forward."]
};

// ===== CARD
function makeCard(text,next){
let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ===== UNIQUE EMOTION WORD
function getEmotionWord(type){
let pool = emotions[type].filter(e=>!usedEmotionWords.includes(e));
let chosen = pool[Math.floor(Math.random()*pool.length)];
usedEmotionWords.push(chosen);
return chosen;
}

// ===== MAIN LOOP
function next(){

if(step>=50){
endGame();
return;
}

// ✅ remove scenario permanently
let s = scenarios.splice(Math.floor(Math.random()*scenarios.length),1)[0];

let emotionWord = getEmotionWord(s.type);
let copingSet = copingGroups[step];

let round = Math.floor(step/5)+1;
let scenarioNum = (step%5)+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>I feel <b>${emotionWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

// processing first
processing[s.type].forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

function showCoping(){
c.innerHTML="";
copingSet.forEach(x=>{
c.appendChild(makeCard(x,()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});
}

}

// ===== START
function startGame(){
step=0;
usedEmotionWords=[];
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 You completed all 50 scenarios.</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
