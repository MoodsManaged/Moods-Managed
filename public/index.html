<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{margin:0;font-family:Arial;text-align:center;color:white;background:#1a1c4b;}
h1{font-size:50px;color:gold;}
#avatar{font-size:80px;margin:15px;}
#scenario h2{font-size:30px;}
#scenario p{font-size:24px;}
#cards{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;margin:30px;}

.card{width:220px;height:320px;perspective:1000px;cursor:pointer;}
.inner{width:100%;height:100%;transition:0.6s;transform-style:preserve-3d;}
.card.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;width:100%;height:100%;
display:flex;justify-content:center;align-items:center;text-align:center;
padding:20px;border-radius:15px;backface-visibility:hidden;
}
.front{background:#2a2f85;}
.back{background:#111;transform:rotateY(180deg);}

button{padding:10px 20px;font-size:16px;}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

// ===== STATE =====
let step=0;
let score=0;
let streak=0;

// ===== CHARACTERS
const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ===== EMOTIONS
const emotions={
scared:["anxious","nervous","on edge","panicked"],
angry:["frustrated","angry","furious"],
sad:["down","lonely","hurt"],
happy:["happy","excited","joyful"],
calm:["calm","peaceful","relaxed"],
strong:["confident","brave","capable"]
};

// ===== UNIQUE SCENARIOS (MATCHED)
const scenarios = [
{text:"I hear something moving in the dark",type:"scared"},
{text:"The lights suddenly go out",type:"scared"},
{text:"Something startles me unexpectedly",type:"scared"},
{text:"I feel unsafe walking somewhere new",type:"scared"},
{text:"A loud noise makes me jump",type:"scared"},

{text:"Someone cuts in front of me unfairly",type:"angry"},
{text:"Someone says something rude",type:"angry"},
{text:"I get blamed for something I didn’t do",type:"angry"},
{text:"Someone ignores my effort",type:"angry"},
{text:"Something feels really unfair",type:"angry"},

{text:"A friend stops talking to me",type:"sad"},
{text:"I feel left out",type:"sad"},
{text:"Something important didn’t work out",type:"sad"},
{text:"I miss someone",type:"sad"},
{text:"I feel alone",type:"sad"},

{text:"I finish something difficult",type:"strong"},
{text:"I help someone",type:"strong"},
{text:"I try something new",type:"strong"},
{text:"I solve a tough problem",type:"strong"},
{text:"I keep going even when it’s hard",type:"strong"},

{text:"Everything feels quiet and peaceful",type:"calm"},
{text:"I sit calmly and relax",type:"calm"},
{text:"Nothing is rushing me",type:"calm"},
{text:"I feel steady and safe",type:"calm"},
{text:"I enjoy a quiet moment",type:"calm"},

{text:"I’m having fun with others",type:"happy"},
{text:"Something exciting is happening",type:"happy"},
{text:"I feel really proud",type:"happy"},
{text:"I laugh a lot",type:"happy"},
{text:"I enjoy a great moment",type:"happy"}
];

// duplicate to reach 50 safely
while(scenarios.length<50){
scenarios.push({...scenarios[scenarios.length%30]});
}

// shuffle
scenarios.sort(()=>Math.random()-0.5);

// ===== PROCESSING PER EMOTION
const processing = {
scared:[
"Wait… am I actually safe right now?",
"Let me slow my breathing.",
"I should look around carefully.",
"Okay… don’t panic."
],
angry:[
"Pause… don’t react yet.",
"Why is this bothering me so much?",
"I need to take a breath.",
"Don’t snap."
],
sad:[
"Why does this feel so heavy?",
"Maybe I shouldn’t go through this alone.",
"It’s okay to feel this.",
"I need a moment."
],
happy:[
"I want to enjoy this.",
"This feels really good.",
"I should appreciate this.",
"Stay in this moment."
],
calm:[
"Stay right here.",
"Nothing needs rushing.",
"This feels steady.",
"Just keep this feeling."
],
strong:[
"I’ve got this.",
"I can handle more.",
"I feel capable.",
"Let’s keep going."
]
};

// ===== DECISION PER EMOTION
function decisions(e){
return [
{t:"Take a breath before doing anything.",type:"best"},
{t:"Pause and think first.",type:"best"},
{t:"Ask for help.",type:"best"},
{t:"Stay calm and choose carefully.",type:"best"},

{t:"Wait and see.",type:"okay"},
{t:"Ignore it for now.",type:"okay"},

{t:"React instantly.",type:"worst"},
{t:"Let it take over.",type:"worst"}
].sort(()=>Math.random()-0.5).slice(0,4);
}

// ===== COPING
const coping={
scared:["Breathe slowly","Look around","Find a safe place","Talk to someone"],
angry:["Move your body","Take space","Breathe deeply","Calm down"],
sad:["Talk to someone","Cry","Rest","Comfort yourself"],
happy:["Share it","Enjoy it","Celebrate","Smile"],
calm:["Relax","Stay present","Read","Breathe"],
strong:["Try more","Lead","Help others","Challenge yourself"]
};

// ===== CARD
function card(text,next,type){
let c=document.createElement("div");
c.className="card";
let inner=document.createElement("div");inner.className="inner";
let front=document.createElement("div");front.className="front";front.innerHTML=text;
let back=document.createElement("div");back.className="back";back.innerHTML="✓";

inner.append(front,back);c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");

if(type==="best"){score+=2;streak++;}
if(type==="okay"){score+=1;streak=0;}
if(type==="worst"){streak=0;}

if(streak>=3) score+=2; // bonus

setTimeout(next,500);
};

return c;
}

// ===== LOOP
function next(){

if(step>=50) return endGame();

let s=scenarios[step];
let emoWord=emotions[s.type][Math.random()*emotions[s.type].length|0];

document.getElementById("info").innerHTML=
`Scenario ${step+1}/50 | Score: ${score} | Streak: ${streak}`;

document.getElementById("avatar").innerHTML=
chars[Math.random()*chars.length|0];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>I feel <b>${emoWord}</b></p>`;

let c=document.getElementById("cards");c.innerHTML="";

processing[s.type].forEach(t=>{
c.appendChild(card(t,()=>showDecision(s)));
});

}

// ===== DECISION
function showDecision(s){
let c=document.getElementById("cards");c.innerHTML="";
decisions(s.type).forEach(d=>{
c.appendChild(card(d.t,()=>showCoping(s),d.type));
});
}

// ===== COPING
function showCoping(s){
let c=document.getElementById("cards");c.innerHTML="";

coping[s.type].forEach(x=>{
c.appendChild(card(x,()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});
}

// ===== START
function startGame(){
score=0;step=0;streak=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 You completed all scenarios.</h2>
<p>Score: ${score}</p>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
