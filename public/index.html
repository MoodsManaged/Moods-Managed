<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: radial-gradient(circle at center, #4a4fcf, #0d0f2a);
      color: white;
      text-align: center;
      perspective: 1000px;
    }

    h1 {
      font-size: 48px;
      color: gold;
      margin-top: 20px;
      text-shadow: 0 0 20px gold;
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    #scenario {
      background: #2b2e6e;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow:
        0 0 20px rgba(0,0,0,0.8),
        0 0 30px rgba(100,100,255,0.5);
    }

    .card {
      width: 140px;
      height: 180px;
      background: linear-gradient(145deg, #6d5cff, #3c3492);
      border-radius: 20px;

      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      margin: 15px;
      padding: 10px;

      cursor: pointer;

      transform-style: preserve-3d;
      transition: all 0.3s ease;

      box-shadow:
        0 10px 20px rgba(0,0,0,0.6),
        inset 0 0 10px rgba(255,255,255,0.2);

      animation: float 3s ease-in-out infinite;
    }

    .card:hover {
      transform: rotateY(15deg) rotateX(10deg) scale(1.1);
      box-shadow:
        0 20px 40px rgba(0,0,0,0.8),
        0 0 20px gold;
    }

    .card:active {
      transform: scale(1.3) rotateY(20deg);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    #info {
      margin: 15px;
      font-size: 20px;
      color: lightgreen;
    }

    #scoreboard {
      margin-top: 20px;
      background: #22245a;
      padding: 15px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 15px;
      margin-left: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: gold;
    }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="game">

  <div id="joinScreen">
    <h2>Enter your name</h2>
    <input id="nameInput" placeholder="Your name..." />
    <button onclick="joinGame()">Join Game</button>
  </div>

  <p id="info">Waiting to join...</p>

  <div id="scenario"></div>

  <h3>Your Cards</h3>
  <div id="cards"></div>

  <div id="scoreboard"></div>

</div>

<script src="/script.js"></script>

</body>
</html>
