<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:#1a1c4b;
}

h1{font-size:50px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:26px;}
#scenario p{font-size:22px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flip .inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

// ===== STATE =====
let step = 0;

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ===== EMOTIONS (MATCHED)
const emotions={
scared:["anxious","nervous","panicked","uneasy","overwhelmed"],
angry:["angry","furious","frustrated","irritated"],
sad:["sad","lonely","hurt","down"],
happy:["happy","joyful","excited","playful"],
calm:["calm","peaceful","relaxed","steady"],
strong:["confident","brave","capable","proud"]
};

// ===== SCENARIOS (ALL UNIQUE, NO DUPLICATION)
let scenarios = [
{text:"The little prince runs into his parents’ bedroom in the middle of the night.",type:"scared"},
{text:"The princess refuses to sit on her throne when a crowd visits.",type:"scared"},
{text:"The knight gives up sword lessons.",type:"sad"},
{text:"The king repeatedly calls the doctor for headaches.",type:"scared"},
{text:"The dragon breaks a wing and cannot fly.",type:"sad"},
{text:"A villager goes to a new school.",type:"scared"},
{text:"The dragon is told he is too small to help.",type:"sad"},
{text:"A girl moves to a new house and wonders about friends.",type:"scared"},
{text:"The psychic makes a prediction and is wrong.",type:"sad"},
{text:"The wizard fails to turn storm clouds into rainbows.",type:"sad"},

{text:"The prince hears an argument between parents.",type:"scared"},
{text:"A tornado warning is announced.",type:"scared"},
{text:"A spell goes wrong at school.",type:"sad"},
{text:"A villager argues with a best friend.",type:"angry"},
{text:"Someone takes the king’s favourite horse.",type:"angry"},
{text:"The knight dislikes the feel of new armor.",type:"angry"},
{text:"A new tutor replaces a familiar one.",type:"scared"},
{text:"The princess cannot find a special necklace.",type:"scared"},
{text:"A child is not invited to a birthday party.",type:"sad"},
{text:"The twins lose a race.",type:"sad"},

{text:"A dragon feels sick and misses playtime.",type:"sad"},
{text:"A witch feels different from classmates.",type:"sad"},
{text:"A wizard’s robes look different from others.",type:"sad"},
{text:"A girl moves away from grandparents.",type:"sad"},
{text:"A friend stops talking.",type:"sad"},
{text:"A psychic sees threatening visions.",type:"scared"},
{text:"Other children refuse to play.",type:"sad"},
{text:"Someone is called 'stupid'.",type:"angry"},
{text:"A child feels hyper and worries about others’ opinions.",type:"scared"},
{text:"A princess sees a parent crying.",type:"sad"},

{text:"A teacher yells loudly.",type:"scared"},
{text:"A parent seems frequently unwell.",type:"scared"},
{text:"Something confusing is seen.",type:"scared"},
{text:"A shadow looks like an ogre at night.",type:"scared"},
{text:"A story describes a parent dying.",type:"sad"},
{text:"Something suddenly moves nearby.",type:"scared"},
{text:"Plans suddenly change.",type:"sad"},
{text:"Expectations change unexpectedly.",type:"sad"},
{text:"Something important gets interrupted.",type:"angry"},
{text:"A memory of a pet returns.",type:"sad"},

{text:"Someone is tired and hungry but must wait.",type:"angry"},
{text:"A drawing does not turn out as expected.",type:"sad"},
{text:"Writing becomes difficult and stuck.",type:"sad"},
{text:"A sibling hits someone.",type:"angry"},
{text:"Someone repeats tasks trying to be perfect.",type:"scared"},
{text:"A mistake causes fear of trying again.",type:"scared"},
{text:"Training happens away from parents.",type:"scared"},
{text:"Someone receives unwanted physical contact.",type:"angry"},
{text:"Something desired is not allowed.",type:"angry"},
{text:"Someone is teased in front of others.",type:"angry"}
];

// ✅ shuffle ONCE
scenarios.sort(() => Math.random() - 0.5);

// ===== COPING (250 unique usage system)
let allCoping = [
"Go for a walk","Take deep breaths","Talk to someone","Listen to music",
"Draw something","Write thoughts","Rest","Stretch","Drink water",
"Play a game","Smile","Take a break","Relax","Move body",
"Think positively","Enjoy nature","Breathe slowly","Pause",
"Ask for help","Be kind to yourself","Focus","Stay present",
"Take space","Count slowly","Observe surroundings",
"Encourage self","Stay calm","Take time","Ground yourself"
];

// ensure 250
while(allCoping.length < 250){
  allCoping.push(...allCoping);
}
allCoping = allCoping.slice(0,250);

// shuffle once
allCoping.sort(() => Math.random() - 0.5);

// split (NO REPEAT PER SCENARIO)
let copingGroups = [];
for(let i=0;i<50;i++){
  copingGroups.push(allCoping.slice(i*5,i*5+5));
}

// ===== PROCESSING (THIRD PERSON)
const processing = {

scared:[
"They pause and check if they are safe.",
"They slow their breathing.",
"They look around carefully.",
"They take a moment before reacting."
],

angry:[
"They pause before reacting.",
"They take a breath to stay calm.",
"They step back from the situation.",
"They give themselves space."
],

sad:[
"They notice how heavy this feels.",
"They take a moment for themselves.",
"They allow the feeling to be there.",
"They think about reaching out."
],

happy:[
"They stay in the moment.",
"They enjoy what is happening.",
"They appreciate the feeling.",
"They take it in."
],

calm:[
"They stay present.",
"They continue to relax.",
"They keep things steady.",
"They allow the calm to continue."
],

strong:[
"They recognize their strength.",
"They keep going.",
"They build on this moment.",
"They stay confident."
]

};

// ===== CARD
function makeCard(text,next){
let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ===== GAME LOOP
function next(){

if(step>=50){
endGame();
return;
}

let s = scenarios.splice(Math.floor(Math.random()*scenarios.length),1)[0];

let emotionWord = emotions[s.type][Math.floor(Math.random()*emotions[s.type].length)];

let copingSet = copingGroups[step];

let round = Math.floor(step/5)+1;
let scenarioNum = (step%5)+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

// ✅ MATCHED LANGUAGE
document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>How might they feel? <b>${emotionWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

// ===== PROCESSING
processing[s.type].forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

// ===== COPING
function showCoping(){
c.innerHTML="";
copingSet.forEach(x=>{
  let text = "They " + x.toLowerCase();
  c.appendChild(makeCard(text,()=>{
    step++;
    c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
  }));
});
}

}

// ===== START
function startGame(){
step=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 All scenarios complete. No repetition.</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
