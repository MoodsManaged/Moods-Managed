<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: radial-gradient(circle at top, #3a3d7c, #12132b);
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      color: gold;
      margin-top: 20px;
      text-shadow: 0 0 10px gold;
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    #scenario {
      background: #2b2e6e;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #5a4fcf;
      padding: 15px;
      margin: 10px;
      border-radius: 15px;
      display: inline-block;
      cursor: pointer;
    }

    .card:hover {
      background: #7b6cff;
      transform: scale(1.05);
    }

    #info {
      margin: 15px;
      font-size: 20px;
      color: lightgreen;
    }

    #scoreboard {
      margin-top: 20px;
      background: #22245a;
      padding: 15px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
    }

    button {
      padding: 10px 15px;
      margin-left: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: gold;
    }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="game">

  <!-- Join screen -->
  <div id="joinScreen">
    <h2>Enter your name</h2>
    <input id="nameInput" placeholder="Your name..." />
    <button onclick="joinGame()">Join Game</button>
  </div>

  <p id="info">Waiting to join...</p>

  <div id="scenario"></div>

  <h3>Your Cards</h3>
  <div id="cards"></div>

  <div id="scoreboard"></div>

</div>

<script src="/script.js"></script>

</body>
</html>
``
