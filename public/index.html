<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:#1a1c4b;
}

h1{font-size:50px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:26px;}
#scenario p{font-size:22px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flip .inner{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let step = 0;

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ✅ EMOTIONS (MATCHED)
const emotions={
scared:["anxious","nervous","panicked","uneasy","overwhelmed"],
angry:["angry","furious","frustrated","irritated"],
sad:["sad","lonely","hurt","down"],
happy:["happy","joyful","excited","playful"],
calm:["calm","peaceful","relaxed","steady"],
strong:["confident","brave","capable","proud"]
};

// ✅ YOUR FULL SCENARIOS (NO DUPLICATION CODE!)
let scenarios = [
{text:"The little prince runs into his parents’ bedroom most nights in the middle of the night.",type:"scared"},
{text:"The princess refuses to sit on her throne when a crowd visits.",type:"scared"},
{text:"The knight has given up sword lessons.",type:"sad"},
{text:"The king calls the doctor repeatedly for headaches.",type:"scared"},
{text:"The dragon breaks his wing and cannot fly.",type:"sad"},
{text:"A villager is going to a new school.",type:"scared"},
{text:"The dragon is told he is too small to help.",type:"sad"},
{text:"A girl moves to a new house and wonders about friends.",type:"scared"},
{text:"The psychic made a prediction but was wrong.",type:"sad"},
{text:"The wizard fails to make a rainbow spell.",type:"sad"},
{text:"The prince hears his parents arguing.",type:"scared"},
{text:"A tornado warning is announced.",type:"scared"},
{text:"A spell goes wrong at school.",type:"sad"},
{text:"A villager argues with a friend.",type:"angry"},
{text:"Someone takes the king’s horse.",type:"angry"},
{text:"The knight dislikes new armor.",type:"angry"},
{text:"A new tutor replaces a familiar one.",type:"scared"},
{text:"The princess cannot find her necklace.",type:"scared"},
{text:"A child is not invited to a party.",type:"sad"},
{text:"The twins lose a race.",type:"sad"},
{text:"A dragon is sick and misses play.",type:"sad"},
{text:"A witch feels different from others.",type:"sad"},
{text:"A wizard feels different from others.",type:"sad"},
{text:"A girl moves away from grandparents.",type:"sad"},
{text:"A friend stops talking.",type:"sad"},
{text:"A psychic sees danger.",type:"scared"},
{text:"Kids refuse to play with someone.",type:"sad"},
{text:"A child is called 'stupid'.",type:"angry"},
{text:"Someone feels hyper and worries.",type:"scared"},
{text:"A child sees their parent crying.",type:"sad"},
{text:"A teacher yells loudly.",type:"scared"},
{text:"A parent acts constantly unwell.",type:"scared"},
{text:"Something confusing is seen.",type:"scared"},
{text:"A shadow looks like an ogre.",type:"scared"},
{text:"A story describes loss.",type:"sad"},
{text:"Something moves suddenly nearby.",type:"scared"},
{text:"Plans suddenly change.",type:"sad"},
{text:"Expectations are changed unexpectedly.",type:"sad"},
{text:"Something important is interrupted.",type:"angry"},
{text:"A memory of a pet returns.",type:"sad"},
{text:"Tired and hungry while waiting.",type:"angry"},
{text:"Art doesn’t turn out right.",type:"sad"},
{text:"Writing gets stuck.",type:"sad"},
{text:"A sibling hits someone.",type:"angry"},
{text:"Trying to be perfect repeatedly.",type:"scared"},
{text:"A mistake causes fear of retrying.",type:"scared"},
{text:"Training away from parents.",type:"scared"},
{text:"Unwanted touch happens.",type:"angry"},
{text:"Something desired is denied.",type:"angry"},
{text:"Someone is teased publicly.",type:"angry"}
];

// ✅ shuffle once
scenarios.sort(() => Math.random() - 0.5);

// ✅ COPING (your list, expanded safely)
let allCoping = [
"Take deep breaths","Listen to music","Talk to a friend","Go for a walk",
"Write your thoughts","Draw something","Rest","Stretch",
"Drink water","Ask for help","Smile","Relax",
"Sit quietly","Think of something happy","Take a break",
"Play a game","Talk to someone","Laugh","Breathe slowly",
"Enjoy nature","Be kind to yourself","Stay calm","Focus",
"Take space","Move your body","Count to 10","Look around",
"Think positive thoughts","Be present"
];

// ensure enough coping (250)
while(allCoping.length < 250){
  allCoping.push(...allCoping);
}
allCoping = allCoping.slice(0,250);

// shuffle once
allCoping.sort(() => Math.random() - 0.5);

// split evenly into 50 groups (5 each)
let copingGroups=[];
for(let i=0;i<50;i++){
  copingGroups.push(allCoping.slice(i*5,i*5+5));
}

// ✅ PROCESSING
const processing={
scared:["Am I safe right now?","Slow down.","Look carefully.","Breathe."],
angry:["Pause.","Don’t snap.","Step back.","Breathe."],
sad:["This feels heavy.","It’s okay.","Take a moment.","Be gentle."],
happy:["Enjoy this.","Stay in it.","Smile.","Appreciate it."],
calm:["Stay here.","Relax.","Be present.","Stay steady."],
strong:["I’ve got this.","Keep going.","Stay confident.","Push forward."]
};

// ===== CARD
function makeCard(text,next){
let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ===== MAIN LOOP
function next(){

if(step>=50){
endGame();
return;
}

// ✅ remove scenario permanently
let s = scenarios.splice(Math.floor(Math.random()*scenarios.length),1)[0];

let emotionWord = emotions[s.type][Math.floor(Math.random()*emotions[s.type].length)];

let copingSet = copingGroups[step];

let round = Math.floor(step/5)+1;
let scenarioNum = (step%5)+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

// ✅ FINAL LANGUAGE FIX
document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>How might they feel? <b>${emotionWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

processing[s.type].forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

function showCoping(){
c.innerHTML="";
copingSet.forEach(x=>{
c.appendChild(makeCard(x,()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});
}

}

// ===== START
function startGame(){
step=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 All scenarios complete. No repetition.</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
