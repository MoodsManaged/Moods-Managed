<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
transition:background 0.6s;
background:#1a1c4b;
}

h1{font-size:48px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:25px;}
#scenario p{font-size:20px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
transform-style:preserve-3d;
transition:0.6s;
position:relative;
}

.card.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let step=0;

// 🎨 BACKGROUND PER EMOTION
const bgColors={
scared:"#1a1c4b",
angry:"#5a1a1a",
sad:"#3b2a4f",
happy:"#b59b1c",
calm:"#1f4f4f",
strong:"#1f4f2f"
};

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// ✅ EMOTIONS
const emotions={
scared:["anxious","nervous","panicked","uneasy"],
angry:["angry","furious","frustrated","irritated"],
sad:["sad","lonely","hurt","down"],
happy:["happy","joyful","excited","playful"],
calm:["calm","peaceful","relaxed","steady"],
strong:["confident","brave","capable","proud"]
};

// ✅ SCENARIOS (NO DUPLICATION)
let scenarios=[ ... ]; // KEEP YOUR FULL LIST HERE (unchanged)

// ✅ SHUFFLE ONCE
scenarios.sort(()=>Math.random()-0.5);

// ✅ COPING (large pool)
let allCoping=[ ... ]; // KEEP YOUR FULL LIST HERE

// ensure enough
while(allCoping.length<250){
allCoping.push(...allCoping);
}
allCoping=allCoping.slice(0,250);

// shuffle once
allCoping.sort(()=>Math.random()-0.5);

// ✅ UNIQUE GROUPS
let copingGroups=[];
for(let i=0;i<50;i++){
copingGroups.push(allCoping.slice(i*5,i*5+5));
}

// ✅ PROCESSING (CORRECT TENSE)
const processing={
scared:[
"They check if they are safe.",
"They slow their breathing.",
"They look around carefully.",
"They pause before reacting."
],
angry:[
"They pause before reacting.",
"They take a deep breath.",
"They step away.",
"They give themselves space."
],
sad:[
"They take a moment.",
"They allow the feeling.",
"They think about reaching out.",
"They are gentle with themselves."
],
happy:[
"They enjoy the moment.",
"They stay present.",
"They appreciate it.",
"They take it in."
],
calm:[
"They stay relaxed.",
"They remain present.",
"They keep things steady.",
"They allow the calm."
],
strong:[
"They feel capable.",
"They keep going.",
"They stay confident.",
"They build on it."
]
};

// ✅ CARD
function makeCard(text,next){
let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ✅ FIX GRAMMAR
function fixGrammar(text){
text=text.toLowerCase();

if(text.startsWith("take ")) return "They take "+text.slice(5);
if(text.startsWith("go ")) return "They go "+text.slice(3);
if(text.startsWith("talk ")) return "They talk "+text.slice(5);
if(text.startsWith("listen ")) return "They listen "+text.slice(7);
if(text.startsWith("write ")) return "They write "+text.slice(6);
if(text.startsWith("draw ")) return "They draw "+text.slice(5);
if(text.startsWith("drink ")) return "They drink "+text.slice(6);
if(text.startsWith("play ")) return "They play "+text.slice(5);
if(text.startsWith("relax")) return "They relax.";
if(text.startsWith("breathe")) return "They take a deep breath.";
if(text.startsWith("ground")) return "They ground themselves.";

return "They "+text;
}

// ✅ GAME LOOP
function next(){

if(step>=50){endGame();return;}

let s=scenarios.splice(Math.floor(Math.random()*scenarios.length),1)[0];

let emotionWord=emotions[s.type][Math.floor(Math.random()*emotions[s.type].length)];

let copingSet=[...copingGroups[step]];

// 🧠 ensure NO duplicates in same deck
copingSet=[...new Set(copingSet)];

document.body.style.background=bgColors[s.type];

let round=Math.floor(step/5)+1;
let scenarioNum=step%5+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2>
<p>How might they feel? <b>${emotionWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

// PROCESSING
processing[s.type].forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

// COPING
function showCoping(){
c.innerHTML="";
copingSet.forEach(x=>{
c.appendChild(makeCard(fixGrammar(x),()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});
}

}

// START
function startGame(){
step=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 All scenarios complete.</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
