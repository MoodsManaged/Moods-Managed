<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: radial-gradient(circle at top, #3a3d7c, #12132b);
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      color: gold;
      margin-top: 20px;
      text-shadow: 0 0 10px gold;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 5px gold; }
      to { text-shadow: 0 0 20px gold; }
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    #scenario {
      background: #2b2e6e;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: linear-gradient(145deg, #5a4fcf, #3c3492);
      padding: 15px;
      margin: 10px;
      border-radius: 15px;
      display: inline-block;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.1);
      background: #7b6cff;
    }

    #info {
      margin: 15px;
      font-size: 20px;
      color: lightgreen;
    }

    #scoreboard {
      margin-top: 20px;
      background: #22245a;
      padding: 15px;
      border-radius: 15px;
    }
  </style>

</head>

<body>

<h1>🏰 Moods Managed</h1>
