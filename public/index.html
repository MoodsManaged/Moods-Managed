<!DOCTYPE html><>Moods Managed</title>

<!-- ✅ load your game logic -->
<script src="game.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(circle, #2c2f6b, #0d0f2e);
  color: white;
  text-align: center;
}

/* TITLE */
h1 {
  margin-top: 70px;
  font-size: 65px;
  color: gold;
  text-shadow: 0 0 25px gold;
}

/* MENU */
#menu {
  margin-top: 30px;
}

/* ROLE BUTTONS */
.role-button {
  background: linear-gradient(145deg, #2a2f85, #1b1d47);
  border: none;
  padding: 20px;
  margin: 15px;
  font-size: 20px;
  border-radius: 20px;
  cursor: pointer;
  color: white;
  width: 220px;

  box-shadow: 0 0 20px rgba(255,215,0,0.4);
  transition: all 0.2s ease;
}

.role-button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px gold;
}

/* GAME AREA */
#game {
  display: none;
}

/* STATS */
#stats {
  margin-top: 20px;
  font-size: 20px;
}

/* SCENARIO */
#scenario {
  margin-top: 25px;
}

/* ✅ HORIZONTAL CARD ROW */
#cards {
  display: flex;
  justify-content: center;
  gap: 30px;
  margin: 40px;
  flex-wrap: wrap;
}

/* ✅ ROBLOX STYLE CARDS */
.card {
  background: linear-gradient(145deg, #23256b, #1b1d47);
  color: white;
  width: 230px;
  padding: 25px;
  border-radius: 20px;
  cursor: pointer;

  box-shadow: 0 0 25px rgba(255,215,0,0.4);
  transition: all 0.2s ease;
}

.card:hover {
  transform: scale(1.08);
  box-shadow: 0 0 50px gold;
}

/* AVATAR */
.avatar {
  font-size: 40px;
  margin-bottom: 10px;
}

/* TEXT */
.choice-text {
  font-size: 16px;
}

/* MULTIPLAYER */
#multiplayer {
  display: none;
  margin-top: 40px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Your Role</h2>

<!-- ✅ FULL MENU -->
<div id="menu">
  <button class="role-button" onclick="startWithRole('knight')">
    ⚔️ Knight
  </button>

  <button class="role-button" onclick="startWithRole('mage')">
    🧙 Mage
  </button>

  <button class="role-button" onclick="startWithRole('dragon')">
    🐉 Dragon
  </button>

  <br>

  <button class="role-button" onclick="startMulti()">
    🌐 Multiplayer
  </button>
</div>

<!-- ✅ GAME -->
<div id="game">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<!-- ✅ MULTIPLAYER -->
<div id="multiplayer">
  <h2>🌐 Multiplayer Mode (coming next)</h2>
</div>

<script>
function startMulti() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("multiplayer").style.display = "block";
}
</script>

</body>
</html>
