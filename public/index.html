<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
  body {
    background: radial-gradient(circle, #2c2f6b, #0d0f2e);
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
  }

  h1 {
    margin-top: 50px;
    font-size: 55px;
    color: gold;
    text-shadow: 0 0 25px gold;
  }

  h2 {
    margin-top: 10px;
  }

  #stats {
    margin-top: 10px;
    font-size: 18px;
  }

  .role-button {
    background: linear-gradient(145deg, #2a2f85, #1b1d47);
    border: none;
    padding: 20px;
    margin: 15px;
    font-size: 20px;
    border-radius: 20px;
    cursor: pointer;
    color: white;
    width: 220px;
    box-shadow: 0 0 20px rgba(255,215,0,0.4);
    transition: 0.2s;
  }

  .role-button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px gold;
  }

  #game {
    display: none;
  }

  #cards {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin: 40px;
    flex-wrap: wrap;
  }

  .card {
    background: linear-gradient(145deg, #23256b, #1b1d47);
    width: 230px;
    padding: 25px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,215,0,0.4);
    transition: 0.2s;
  }

  .card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 50px gold;
  }

  .avatar {
    font-size: 40px;
    margin-bottom: 10px;
  }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Your Role</h2>

<div id="menu">
  <button class="role-button" onclick="startGame('knight')">⚔️ Knight</button>
  <button class="role-button" onclick="startGame('mage')">🧙 Mage</button>
  <button class="role-button" onclick="startGame('dragon')">🐉 Dragon</button>
</div>

<div id="game">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>
let level = 1;
let role = "";
let unrest = 0;

const roles = {
  knight: { name: "Knight", emoji: "⚔️" },
  mage: { name: "Mage", emoji: "🧙‍♂️" },
  dragon: { name: "Dragon", emoji: "🐉" }
};

const reactions = {
  knight: {
    good: "🛡️ The knight steadies and leads with honor.",
    bad: "⚠️ The knight rushes forward without thinking!"
  },
  mage: {
    good: "🔮 The mage regains control of the magic.",
    bad: "💥 Magic bursts wildly in all directions!"
  },
  dragon: {
    good: "🐉 The dragon exhales slowly... the fire calms.",
    bad: "🔥 The dragon’s fire spirals out of control!"
  }
};

const feedbackGood = [
  "That helps slow things down before reacting.",
  "That gives the feeling space instead of taking over.",
  "That’s a strong way to stay in control."
];

const feedbackBad = [
  "That might make the feeling stronger.",
  "That doesn’t give time to think.",
  "That could lead to losing control."
];

function startGame(selected) {
  role = selected;
  level = 1;
  unrest = 0;

  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  nextScenario();
}

function nextScenario() {
  checkUnrest();

  const s = generateScenario();

  document.getElementById("scenario").innerHTML = `
    <h2>🏰 ${s.text}</h2>
    <p>${s.feelingEmoji} Someone feels <b>${s.feeling}</b></p>
    <p>💭 What is the BEST first step?</p>
  `;

  document.getElementById("stats").innerHTML = `
    ${roles[role].emoji} ${roles[role].name} | ⭐ Level ${level} | ⚠️ Unrest ${unrest}
  `;

  const container = document.getElementById("cards");
  container.innerHTML = "";

  s.process.forEach(choice => {
    const el = document.createElement("div");
    el.className = "card";

    el.innerHTML = `
      <div class="avatar">🧠</div>
      <div>${choice.text}</div>
    `;

    el.onclick = () => showDecision(s);
    container.appendChild(el);
  });
}

function showDecision(s) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  document.getElementById("scenario").innerHTML += `
    <p>✅ You helped them pause. Now choose a coping tool:</p>
  `;

  s.choices.forEach(choice => createCard(choice.text, choice.type));
}

function createCard(text, type) {
  const el = document.createElement("div");
  el.className = "card";

  el.innerHTML = `
    <div class="avatar">${type === "best" ? "✨" : type === "okay" ? "🌀" : "⚠️"}</div>
    <div>${text}</div>
  `;

  el.onclick = () => {
    let msg = "";

    if (type === "best") {
      level++;
      msg = random(feedbackGood);
    } 
    else if (type === "okay") {
      msg = "That could help a bit, but there may be a stronger option.";
    } 
    else {
      unrest++;
      msg = random(feedbackBad);
    }

    showFeedback(msg, reactions[role][type === "worst" ? "bad" : "good"]);
  };

  document.getElementById("cards").appendChild(el);
}

function showFeedback(text, reaction) {
  const msg = document.createElement("div");
  msg.innerHTML = `
    <p>${reaction}</p>
    <p>${text}</p>
  `;
  msg.style.marginTop = "20px";

  document.getElementById("cards").appendChild(msg);

  setTimeout(nextScenario, 2000);
}

function checkUnrest() {
  if (unrest >= 5) {
    document.getElementById("game").innerHTML = `
      <h1>💥 The Kingdom Falls</h1>
      <p>You created too much unrest...</p>
      <p>You overthrow the Royals 👑</p>
      <p>But you are trapped in the kingdom forever.</p>
    `;
  }
}

function random(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function generateScenario() {
  const scenarios = [
    "A villager drops their harvest and feels overwhelmed",
    "A young knight is afraid before battle",
    "A dragon becomes angry when someone enters its cave",
    "A mage feels sad after failing a spell"
  ];

  const feelings = [
    { name: "angry", emoji: "😡" },
    { name: "sad", emoji: "😢" },
    { name: "afraid", emoji: "😱" }
  ];

  const feeling = random(feelings);

  return {
    text: random(scenarios),
    feeling: feeling.name,
    feelingEmoji: feeling.emoji,

    process: [
      { text: "Pause and take a breath" },
      { text: "Notice the feeling" },
      { text: "Give yourself time to think" }
    ],

    choices: [
      { text: "Stay calm and think first", type: "best" },
      { text: "Talk to someone", type: "best" },
      { text: "Ignore it", type: "okay" },
      { text: "React immediately", type: "worst" },
      { text: "Blame others", type: "worst" }
    ]
  };
}
</script>

</body>
</html>
