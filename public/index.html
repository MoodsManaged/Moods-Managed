<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background: radial-gradient(circle,#2c2f6b,#0d0f2e);
}

h1{font-size:55px;color:gold;}

#avatar{font-size:90px;margin:20px;}

#scenario h2{font-size:32px;}
#scenario p{font-size:28px;}

#cards{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin:40px;
}

.card{
width:240px;
height:360px;
perspective:1000px;
}

.card-inner{
width:100%;
height:100%;
position:relative;
transform-style:preserve-3d;
transition:0.6s;
}

.card.flipped .card-inner{transform:rotateY(180deg);}

.card-front,.card-back{
position:absolute;
width:100%;
height:100%;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.card-front{background:#2a2f85;}
.card-back{background:#111;transform:rotateY(180deg);}

.processing .card-front{border:3px solid #3a86ff;}
.decision .card-front{border:3px solid gold;}
.coping .card-front{border:3px solid #06d6a0;}

button{
padding:15px 30px;
font-size:20px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="roundInfo"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

// ===== STATE =====
let usedScenarios=[];
let score=0;

// ===== CHARACTERS
const chars=["⚔️","🧙","🐉","👑","🧝","🦄","🐺","🧑"];

// ===== EMOTIONS
const emotionWords={
angry:["angry","furious","frustrated","irritated"],
scared:["anxious","worried","panicked","overwhelmed"],
sad:["sad","lonely","hopeless","disappointed"],
happy:["happy","excited","joyful","playful"],
calm:["calm","peaceful","relaxed","safe"],
strong:["confident","brave","proud","capable"]
};

// ===== SCENARIO CLUSTERS
const clusters = {

home:[
{text:"I hear a noise at night",type:"scared"},
{text:"My parents argue loudly",type:"scared"},
{text:"Something breaks unexpectedly",type:"angry"},
{text:"I feel left out at home",type:"sad"}
],

school:[
{text:"Someone laughs at me",type:"sad"},
{text:"I get a bad grade",type:"sad"},
{text:"Someone cheats in a game",type:"angry"},
{text:"I must present in front of class",type:"scared"}
],

social:[
{text:"A friend ignores me",type:"sad"},
{text:"Someone says something mean",type:"angry"},
{text:"I feel nervous meeting new people",type:"scared"},
{text:"I help someone successfully",type:"strong"}
],

fantasy:[
{text:"A dragon roars nearby",type:"scared"},
{text:"A knight challenges me unfairly",type:"angry"},
{text:"I fail a magical task",type:"sad"},
{text:"I defeat a challenge",type:"strong"}
]

};

// flatten all scenarios
let allScenarios = Object.values(clusters).flat();

// ===== HUGE PROCESSING (50+)
const processing = Array.from({length:60},(_,i)=>
[
"Pause and breathe","Think before acting","Slow down",
"Check how I feel","Notice my body",
"Ask what I need","Wait a moment",
"Observe carefully","Stay still",
"Take control","Step back",
"Stay calm","Focus on breathing",
"Be curious","Name my feeling",
"Remind myself I’m okay",
"Look around safely",
"Don’t rush","Stay present"
][i%20] + " " + (i+1)
);

// ===== HUGE DECISION ENGINE (emotion-based)

function buildDecisions(emotion){

const base = {
best:[
"Take a breath first","Pause and think",
"Ask for help","Stay calm","Choose carefully",
"Think of a solution","Check my options",
"Make a safe choice"
],
okay:[
"Wait for a bit","Do nothing for now",
"Walk away","Ignore it slightly",
"Delay reacting"
],
worst:[
"React instantly","Yell","Blame someone",
"Panic","Rush","Give up"
]
};

let result=[];

// add AI-style variety
base.best.forEach(t=>{
for(let i=0;i<3;i++){
result.push({t:`${t} (${emotion})`,type:"best"});
}
});

base.okay.forEach(t=>{
for(let i=0;i<2;i++){
result.push({t:`${t} (${emotion})`,type:"okay"});
}
});

base.worst.forEach(t=>{
result.push({t:`${t} (${emotion})`,type:"worst"});
});

return result.sort(()=>Math.random()-0.5).slice(0,4);

}

// ===== COPING
const coping={
scared:["Breathe slowly","Ground yourself","Find safe place","Talk to someone"],
angry:["Move body","Take space","Breathe deeply","Release safely"],
sad:["Talk to someone","Cry","Rest","Comfort yourself"],
happy:["Share","Play","Celebrate","Enjoy"],
calm:["Relax","Stay present","Read","Rest"],
strong:["Try something new","Lead","Help","Challenge yourself"]
};

// ===== CARD
function card(text,stage,next,meta){

const c=document.createElement("div");
c.className="card "+stage;

const inner=document.createElement("div");
inner.className="card-inner";

const front=document.createElement("div");
front.className="card-front";
front.innerHTML=text;

const back=document.createElement("div");
back.className="card-back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flipped");

if(meta){
if(meta.type==="best")score+=2;
if(meta.type==="okay")score+=1;
}

setTimeout(next,500);
};

return c;
}

// ===== START
function startGame(){
score=0;
usedScenarios=[];
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ===== MAIN LOOP
function next(){

if(usedScenarios.length===allScenarios.length){
endGame();
return;
}

// pick by cluster rotation
const clusterKeys = Object.keys(clusters);
const cluster = clusters[clusterKeys[usedScenarios.length % clusterKeys.length]];
const available = cluster.filter(s=>!usedScenarios.includes(s));

let s = available.length>0 
? available[Math.floor(Math.random()*available.length)]
: allScenarios.filter(x=>!usedScenarios.includes(x))[0];

usedScenarios.push(s);

const emo = s.type;
const word = emotionWords[emo][Math.random()*emotionWords[emo].length|0];

document.getElementById("roundInfo").innerHTML=
`Progress: ${usedScenarios.length}/${allScenarios.length} | Score: ${score}`;

document.getElementById("avatar").innerHTML=
chars[Math.random()*chars.length|0];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>💭 I feel <b>${word}</b></p>`;

const cards=document.getElementById("cards");
cards.innerHTML="";

processing.sort(()=>Math.random()-0.5).slice(0,4)
.forEach(t=>cards.appendChild(card(t,"processing",()=>showDecision(emo))));

}

// ===== DECISION
function showDecision(emo){

const cards=document.getElementById("cards");
cards.innerHTML="";

buildDecisions(emo)
.forEach(d=>cards.appendChild(card(d.t,"decision",()=>showCoping(emo),d)));

}

// ===== COPING
function showCoping(emo){

const cards=document.getElementById("cards");
cards.innerHTML="";

coping[emo].forEach(c=>{
cards.appendChild(card(c,"coping",()=>{
cards.innerHTML=`
<p>✅ Good choice</p>
<button onclick="next()">➡️ GO TO NEXT ROUND</button>
`;
}));
});

}

// ===== END
function endGame(){
document.getElementById("cards").innerHTML="";
document.getElementById("scenario").innerHTML=`
<h2>🎉 You completed ALL scenarios!</h2>
<p>Total Score: ${score}</p>
<button onclick="startGame()">Play Again</button>
`;
}

</script>

</body>
</html>
