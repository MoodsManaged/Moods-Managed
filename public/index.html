<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
  body {
    background: radial-gradient(circle, #2c2f6b, #0d0f2e);
    color: white;
    text-align: center;
    font-family: Arial, sans-serif;
    margin: 0;
  }

  h1 {
    margin-top: 70px;
    font-size: 65px;
    color: gold;
    text-shadow: 0 0 25px gold;
  }

  h2 {
    margin-top: 10px;
  }

  .role-button {
    background: linear-gradient(145deg, #2a2f85, #1b1d47);
    border: none;
    padding: 20px;
    margin: 15px;
    font-size: 20px;
    border-radius: 20px;
    cursor: pointer;
    color: white;
    width: 220px;
    box-shadow: 0 0 20px rgba(255,215,0,0.4);
    transition: 0.2s;
  }

  .role-button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 40px gold;
  }

  #game {
    display: none;
  }

  #cards {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 40px;
    flex-wrap: wrap;
  }

  .card {
    background: linear-gradient(145deg, #23256b, #1b1d47);
    width: 230px;
    padding: 25px;
    border-radius: 20px;
    cursor: pointer;
    box-shadow: 0 0 25px rgba(255,215,0,0.4);
    transition: 0.2s;
  }

  .card:hover {
    transform: scale(1.08);
    box-shadow: 0 0 50px gold;
  }

  .avatar {
    font-size: 40px;
    margin-bottom: 10px;
  }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Your Role</h2>

<div id="menu">
  <button class="role-button" onclick="startGame('knight')">⚔️ Knight</button>
  <button class="role-button" onclick="startGame('mage')">🧙 Mage</button>
  <button class="role-button" onclick="startGame('dragon')">🐉 Dragon</button>
</div>

<div id="game">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<script>
let level = 1;
let role = "";

const roles = {
  knight: { name: "Knight", emoji: "⚔️" },
  mage: { name: "Mage", emoji: "🧙‍♂️" },
  dragon: { name: "Dragon", emoji: "🐉" }
};

const emotions = {
  angry: "😡",
  sad: "😢",
  afraid: "😱"
};

function startGame(selected) {
  role = selected;
  level = 1;
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";
  nextScenario();
}

function nextScenario() {
  const s = generateScenario();

  document.getElementById("scenario").innerHTML = `
    <h2>${s.text}</h2>
    <p>${emotions[s.feeling]} You feel ${s.feeling}</p>
    <p>💭 What do you do FIRST?</p>
  `;

  document.getElementById("stats").innerHTML = `
    ${roles[role].emoji} ${roles[role].name} | ⭐ Level ${level}
  `;

  const container = document.getElementById("cards");
  container.innerHTML = "";

  ["Pause and breathe", "Name your feeling", "Take time to think"]
  .forEach(choice => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="avatar">🧠</div>
      <div>${choice}</div>
    `;
    el.onclick = () => showDecision(s);
    container.appendChild(el);
  });
}

function showDecision(s) {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  s.good.forEach(c => createCard(c, true));
  s.bad.forEach(c => createCard(c, false));
}

function createCard(text, good) {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <div class="avatar">${good ? "✨" : "⚠️"}</div>
    <div>${text}</div>
  `;

  el.onclick = () => {
    if (good) level++;
    nextScenario();
  };

  document.getElementById("cards").appendChild(el);
}

function generateScenario() {
  const feelings = ["angry", "sad", "afraid"];

  return {
    text: "A challenge appears...",
    feeling: feelings[Math.floor(Math.random()*3)],
    good: ["Stay calm", "Think clearly"],
    bad: ["React instantly", "Lose control"]
  };
}
</script>

</body>
</html>
