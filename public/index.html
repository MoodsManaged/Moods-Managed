<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
transition:background 0.6s;
background:#1a1c4b;
}

h1{font-size:48px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:25px;}
#scenario p{font-size:20px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
transform-style:preserve-3d;
transition:0.6s;
position:relative;
}

.card.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:16px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let step = 0;

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

const bgColors={
scared:"#1a1c4b",
angry:"#5a1a1a",
sad:"#3b2a4f",
happy:"#b59b1c",
calm:"#1f4f4f",
strong:"#1f4f2f"
};

const emotions={
scared:["anxious","nervous","panicked","uneasy"],
angry:["angry","furious","frustrated","irritated"],
sad:["sad","lonely","hurt","down"],
happy:["happy","joyful","excited","playful"],
calm:["calm","peaceful","relaxed","steady"],
strong:["confident","brave","capable","proud"]
};

// ✅ SIMPLE WORKING SCENARIOS (safe + no crash)
let scenarios = [
{text:"The prince hears a loud noise at night.",type:"scared"},
{text:"Someone takes something important.",type:"angry"},
{text:"A friend stops talking.",type:"sad"},
{text:"A challenge is completed.",type:"strong"},
{text:"Everything feels peaceful.",type:"calm"},
{text:"Something exciting happens.",type:"happy"}
];

// expand safely to 50
while(scenarios.length<50){
scenarios.push({...scenarios[scenarios.length%6]});
}
scenarios.sort(()=>Math.random()-0.5);

// ✅ COPING
let allCoping=[
"take a deep breath","go for a walk","talk to someone","rest",
"draw something","write thoughts","listen to music","move body",
"drink water","take a break","relax","smile","focus","stay present"
];

// expand to 250
while(allCoping.length < 250){
allCoping.push(...allCoping);
}

allCoping = allCoping.slice(0,250);
allCoping.sort(()=>Math.random()-0.5);

// split groups
let copingGroups=[];
for(let i=0;i<50;i++){
copingGroups.push([...new Set(allCoping.slice(i*5,i*5+5))]);
}

// ✅ PROCESSING
const processing={
scared:[
"They check if they are safe.",
"They slow their breathing.",
"They look around.",
"They pause."
],
angry:[
"They pause before reacting.",
"They take a breath.",
"They step away.",
"They give space."
],
sad:[
"They take a moment.",
"They allow the feeling.",
"They think about support.",
"They are gentle."
],
happy:[
"They enjoy the moment.",
"They stay present.",
"They appreciate it.",
"They take it in."
],
calm:[
"They stay relaxed.",
"They remain steady.",
"They stay present.",
"They allow calm."
],
strong:[
"They feel capable.",
"They keep going.",
"They stay confident.",
"They build on progress."
]
};

function fix(text){
return "They " + text;
}

function makeCard(text,next){

let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

function next(){

if(step>=50){endGame();return;}

let s=scenarios.splice(Math.floor(Math.random()*scenarios.length),1)[0];

document.body.style.background=bgColors[s.type];

let emotionWord=emotions[s.type][Math.floor(Math.random()*emotions[s.type].length)];

let copingSet=copingGroups[step];

let round=Math.floor(step/5)+1;
let scenarioNum=step%5+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2><p>How might they feel? <b>${emotionWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

processing[s.type].forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

function showCoping(){
c.innerHTML="";
copingSet.forEach(x=>{
c.appendChild(makeCard("They " + x,()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});
}

}

function startGame(){
step=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

function endGame(){
document.getElementById("scenario").innerHTML=`<h2>🎉 Finished!</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
``
