<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
transition:background 0.6s;
background:#1a1c4b;
}

h1{font-size:48px;color:gold;}

#avatar{font-size:80px;margin:15px;}

#scenario h2{font-size:24px;}
#scenario p{font-size:20px;}

#cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:25px;
margin:40px;
}

.card{
width:220px;
height:300px;
perspective:1000px;
cursor:pointer;
}

.inner{
width:100%;
height:100%;
transition:0.6s;
transform-style:preserve-3d;
position:relative;
}

.card.flip .inner{transform:rotateY(180deg);}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:16px;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
backface-visibility:hidden;
}

.front{
background:linear-gradient(145deg,#2a2f85,#4045c7);
box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back{
background:#111;
transform:rotateY(180deg);
}

button{
padding:12px 24px;
font-size:18px;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="startScreen">
<button onclick="startGame()">Start Game</button>
</div>

<div id="game" style="display:none;">
<div id="info"></div>
<div id="avatar"></div>
<div id="scenario"></div>
<div id="cards"></div>
</div>

<script>

let step=0;

const chars=["⚔️","🧙","🐉","👑","🦄","🐺"];

// 🎨 COLORS
const bgColors={
scared:"#1a1c4b",
angry:"#5a1a1a",
sad:"#3b2a4f",
happy:"#b59b1c",
calm:"#1f4f4f",
strong:"#1f4f2f"
};

// ✅ SCENARIOS (USE YOUR FULL LIST HERE — NO DUPLICATES, NO LOOPS)
let scenarios = [
{text:"The little prince runs into his parents’ bedroom in the middle of the night.",type:"scared"},
{text:"A villager goes to a new school.",type:"scared"},
{text:"A friend stops talking to the prince.",type:"sad"},
{text:"Someone takes the king’s horse.",type:"angry"},
{text:"A dragon cannot fly because of an injury.",type:"sad"},
{text:"A wizard fails a spell in front of others.",type:"sad"},
{text:"The prince hears his parents arguing.",type:"scared"},
{text:"A loud storm shakes the house.",type:"scared"},
{text:"A project gets ruined at the last moment.",type:"angry"},
{text:"A child is left out of a group.",type:"sad"},
{text:"A mistake happens during an important task.",type:"sad"},
{text:"A character is teased in front of others.",type:"angry"},
{text:"A shadow appears at night in the room.",type:"scared"},
{text:"A plan suddenly gets cancelled.",type:"sad"},
{text:"Someone feels overwhelmed by too many tasks.",type:"scared"},
{text:"A child is told they cannot do something they wanted.",type:"angry"},
{text:"A memory of someone important comes back.",type:"sad"},
{text:"A character hears yelling nearby.",type:"scared"},
{text:"A friend ignores a message.",type:"sad"},
{text:"A game does not go as expected.",type:"sad"},
{text:"Someone is treated unfairly.",type:"angry"},
{text:"A character notices others laughing at them.",type:"angry"},
{text:"Something unexpected happens suddenly.",type:"scared"},
{text:"A situation feels confusing.",type:"scared"},
{text:"A character feels alone in a group.",type:"sad"},
{text:"Something important gets interrupted.",type:"angry"},
{text:"A moment feels calm and peaceful.",type:"calm"},
{text:"A character enjoys a joyful moment.",type:"happy"},
{text:"A challenge is overcome successfully.",type:"strong"},
{text:"A character feels proud of progress.",type:"strong"}
];

// 🔒 SHUFFLE ONCE
scenarios.sort(()=>Math.random()-0.5);

// ✅ FLAT EMOTIONS (NO REPEAT)
let allEmotions=[
"anxious","nervous","panicked","uneasy","overwhelmed",
"angry","furious","frustrated","irritated","annoyed",
"sad","lonely","hurt","down","hopeless",
"happy","joyful","excited","playful","cheerful",
"calm","peaceful","relaxed","steady","safe",
"confident","brave","capable","proud","strong",
"worried","tense","startled","shocked","uncertain",
"disappointed","excluded","heavy","empty","quiet",
"thrilled","energised","hopeful","curious","inspired"
];

allEmotions=allEmotions.slice(0,50);

// ✅ COPING (YOUR REAL LIST)
let allCoping = [

// 👉 PASTE YOUR FULL COPING LIST HERE (important)

"take deep breaths","go for a walk","talk to someone","relax","write thoughts",
"draw something","listen to music","move the body","rest","drink water"

];

// ensure 250
while(allCoping.length<250){
allCoping.push(...allCoping);
}
allCoping=allCoping.slice(0,250);

// shuffle once
allCoping.sort(()=>Math.random()-0.5);

// split
let copingGroups=[];
for(let i=0;i<50;i++){
copingGroups.push([...new Set(allCoping.slice(i*5,i*5+5))]);
}

// ✅ PROCESSING (CORRECT)
const processing={
scared:[
"They check whether they are safe.",
"They slow their breathing.",
"They look around carefully.",
"They pause."
],
angry:[
"They pause before reacting.",
"They take a deep breath.",
"They step away.",
"They give space."
],
sad:[
"They take a moment.",
"They allow the feeling.",
"They think about support.",
"They are gentle."
],
happy:[
"They enjoy the moment.",
"They stay present.",
"They appreciate it.",
"They take it in."
],
calm:[
"They stay relaxed.",
"They remain steady.",
"They stay present.",
"They allow calm."
],
strong:[
"They feel capable.",
"They keep going.",
"They stay confident.",
"They build on progress."
]
};

// ✅ GRAMMAR FIX
function fix(text){
if(text.startsWith("take ")) return "They take "+text.slice(5);
if(text.startsWith("go ")) return "They go "+text.slice(3);
if(text.startsWith("talk ")) return "They talk "+text.slice(5);
if(text.startsWith("listen ")) return "They listen "+text.slice(7);
if(text.startsWith("write ")) return "They write "+text.slice(6);
if(text.startsWith("draw ")) return "They draw "+text.slice(5);
if(text.startsWith("drink ")) return "They drink "+text.slice(6);
if(text.startsWith("move ")) return "They move "+text.slice(5);
if(text.startsWith("rest")) return "They rest.";
if(text.startsWith("relax")) return "They relax.";
return "They "+text;
}

// ✅ CARD
function makeCard(text,next){
let c=document.createElement("div");
c.className="card";

let inner=document.createElement("div");
inner.className="inner";

let front=document.createElement("div");
front.className="front";
front.innerHTML=text;

let back=document.createElement("div");
back.className="back";
back.innerHTML="✓";

inner.append(front,back);
c.appendChild(inner);

c.onclick=()=>{
c.classList.add("flip");
setTimeout(next,500);
};

return c;
}

// ✅ MAIN LOOP (QUEUE SYSTEM)
function next(){

if(step>=scenarios.length){
endGame();
return;
}

let s=scenarios[step];
let emotionWord=allEmotions[step];
let copingSet=copingGroups[step];

document.body.style.background=bgColors[s.type];

let round=Math.floor(step/5)+1;
let scenarioNum=(step%5)+1;

document.getElementById("info").innerHTML=
`Round ${round}/10 — Scenario ${scenarioNum}/5`;

document.getElementById("avatar").innerHTML=
chars[Math.floor(Math.random()*chars.length)];

document.getElementById("scenario").innerHTML=
`<h2>${s.text}</h2>
<p>How might they feel? <b>${emotionWord}</b></p>`;

let c=document.getElementById("cards");
c.innerHTML="";

// PROCESSING
processing[s.type].forEach(p=>{
c.appendChild(makeCard(p,showCoping));
});

function showCoping(){
c.innerHTML="";
copingSet.forEach(x=>{
c.appendChild(makeCard(fix(x),()=>{
step++;
c.innerHTML=`<button onclick="next()">➡️ NEXT</button>`;
}));
});
}

}

// ✅ START
function startGame(){
step=0;
document.getElementById("startScreen").style.display="none";
document.getElementById("game").style.display="block";
next();
}

// ✅ END
function endGame(){
document.getElementById("scenario").innerHTML=
`<h2>🎉 Game complete — nothing repeated.</h2>`;
document.getElementById("cards").innerHTML="";
}

</script>

</body>
</html>
