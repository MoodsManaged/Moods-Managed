<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: radial-gradient(circle at top, #3a3d7c, #12132b);
      color: white;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      color: gold;
      margin-top: 20px;
      text-shadow: 0 0 10px gold;
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    #scenario {
      background: #2b2e6e;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: #5a4fcf;
      padding: 15px;
      margin: 10px;
      border-radius: 15px;
      display: inline-block;
      cursor: pointer;
    }

    #info {
      margin: 15px;
      font-size: 20px;
      color: lightgreen;
    }

    #scoreboard {
      margin-top: 20px;
      background: #22245a;
      padding: 15px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="game">

  <p id="info">Waiting for players...</p>

  <div id="scenario"></div>

  <h3>Your Cards</h3>
  <div id="cards"></div>

  <div id="submissions"></div>
  <div id="scoreboard"></div>

</div>

<!-- ✅ VERY IMPORTANT LINE -->
<script src="/script.js"></script>

</body>
</html>
