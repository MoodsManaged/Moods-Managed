<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<!-- ✅ ✅ REAL SCRIPT TAGS (CORRECT HTML) -->
<script src="/socket.io/socket.io.js"></script>
<script src="game.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to bottom, #1b1d47, #0d0f2e);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 80px;
  font-size: 60px;
  color: gold;
  text-shadow: 0 0 20px gold;
}

h2 {
  font-size: 30px;
  margin-top: 20px;
}

.menu {
  margin-top: 40px;
}

button {
  background: gold;
  border: none;
  padding: 15px 30px;
  margin: 15px;
  font-size: 18px;
  border-radius: 12px;
  cursor: pointer;
}

.card {
  background: white;
  color: black;
  padding: 12px;
  margin: 10px auto;
  width: 260px;
  border-radius: 10px;
  cursor: pointer;
}

#game {
  display: none;
}

#multiplayer {
  display: none;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Mode</h2>

<div id="menu" class="menu">
  <button onclick="startStory()">🏰 Story Mode</button>
  <button onclick="startSingle()">🎮 Single Player</button>
  <button onclick="startMulti()">🌐 Multiplayer</button>
</div>

<div id="game">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<div id="multiplayer">
  <h2>🌐 Multiplayer Mode</h2>
</div>

<script>
// ✅ functions now WILL work because JS is properly loaded

function startStory() {
  startGame();
}

function startSingle() {
  startGame();
}

function startGame() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  nextScenario(); // ✅ from game.js
}

function startMulti() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("multiplayer").style.display = "block";
}
</script>

</body>
</html>
