<!DOCTYPE html>
<html>
<head>
  <title>Moods Managed</title>

  <style>
    body {
      margin: 0;
      font-family: Georgia, serif;
      background: radial-gradient(circle at center, #4a4fcf, #0d0f2a);
      color: white;
      text-align: center;
      perspective: 1000px;
    }

    h1 {
      font-size: 48px;
      color: gold;
      margin-top: 20px;
      text-shadow: 0 0 20px gold;
    }

    #game {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      width: 140px;
      height: 180px;
      background: linear-gradient(145deg, #6d5cff, #3c3492);
      border-radius: 20px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      margin: 15px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 10px 20px black;
    }

    .card:hover {
      transform: scale(1.1) rotateY(10deg);
      box-shadow: 0 0 20px gold;
    }

    button {
      padding: 12px 20px;
      margin: 10px;
      border-radius: 10px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      background: gold;
    }

    #scenario {
      padding: 20px;
      margin-bottom: 20px;
      background: #2b2e6e;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<h1>🏰 Moods Managed</h1>

<div id="game">

  <!-- MODE SELECT -->
  <div id="modeScreen">
    <h2>Choose Mode</h2>
    <button onclick="startSingle()">🎮 Single Player</button>
    <button onclick="startMulti()">🌐 Multiplayer</button>
  </div>

  <!-- NAME INPUT -->
  <div id="joinScreen" style="display:none;">
    <h2>Enter your name</h2>
    <input id="nameInput" />
    <button onclick="joinGame()">Join</button>
  </div>

  <p id="info"></p>
  <div id="scenario"></div>

  <h3>Your Cards</h3>
  <div id="cards"></div>

</div>

/script.jsscript>

</body>
</html>
