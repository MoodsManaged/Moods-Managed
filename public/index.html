<!DOCTYPE html>
<html>
<head>
<title>Moods Managed</title>

<script src="game.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to bottom, #1b1d47, #0d0f2e);
  color: white;
  text-align: center;
}

h1 {
  margin-top: 80px;
  font-size: 60px;
  color: gold;
}

button {
  background: gold;
  border: none;
  padding: 15px 25px;
  margin: 10px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
}

.card {
  background: white;
  color: black;
  padding: 10px;
  margin: 10px auto;
  width: 250px;
  border-radius: 10px;
  cursor: pointer;
}

#game, #multiplayer {
  display: none;
}
</style>
</head>

<body>

<h1>🏰 Moods Managed</h1>
<h2>Choose Mode</h2>

<div id="menu">
  <button onclick="startStory()">🏰 Story Mode</button>
  <button onclick="startSingle()">🎮 Single Player</button>
  <button onclick="startMulti()">🌐 Multiplayer</button>
</div>

<div id="game">
  <div id="stats"></div>
  <div id="scenario"></div>
  <div id="cards"></div>
</div>

<div id="multiplayer">
  <h2>Multiplayer Mode (coming next)</h2>
</div>

<script>
function startStory() {
  startGame();
}

function startSingle() {
  startGame();
}

function startGame() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";
  nextScenario();
}

function startMulti() {
  document.getElementById("menu").style.display = "none";
  document.getElementById("multiplayer").style.display = "block";
}
</script>

</body>
</html>
